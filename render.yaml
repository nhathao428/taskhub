# Render Blueprint — one-click deploy:
#   1. Push this repo to GitHub
#   2. Visit https://render.com → New → Blueprint → connect repo
#   3. Render auto-creates: backend (Docker), frontend (static), Postgres
#
# Free tier limits: backend sleeps after 15min idle (cold start ~30-60s on wake),
# Postgres free for 90 days then needs upgrade.
#
# After Postgres is created, Render fills DB_HOST/DB_PORT/etc automatically.
# Set GEMINI_API_KEY manually in Render dashboard if you want AI suggestion.

databases:
  - name: tms-db
    databaseName: task_management_db
    user: postgres
    plan: free

services:
  - type: web
    name: tms-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api-docs
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: SERVER_PORT
        value: 5000
      - key: CACHE_TYPE
        value: none                              # skip Redis on free tier
      - key: DB_HOST
        fromDatabase: { name: tms-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: tms-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: tms-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: tms-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: tms-db, property: password }
      - key: JWT_SECRET
        generateValue: true                      # Render generates 32-char secret
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        generateValue: true                       # ngẫu nhiên — xem ở Render dashboard
      # Tài khoản manager mẫu (đăng nhập được) — credential demo công khai, vai trò MANAGER.
      - key: MANAGER_USERNAME
        value: manager1
      - key: MANAGER_EMAIL
        value: manager@example.com
      - key: MANAGER_PASSWORD
        value: Manager@123                         # đổi/để sync:false nếu không muốn public
      # Tài khoản nhân viên mẫu (đăng nhập được) — credential demo công khai, vai trò EMPLOYEE
      # (quyền thấp). Admin vẫn dùng mật khẩu ngẫu nhiên ở trên nên không bị lộ.
      - key: EMPLOYEE_USERNAME
        value: employee1
      - key: EMPLOYEE_EMAIL
        value: employee@example.com
      - key: EMPLOYEE_PASSWORD
        value: Employee@123                       # đổi/để sync:false nếu không muốn public
      # Pool ~30 nhân viên (hồ sơ, không kèm login) để demo gợi ý phân công AI.
      - key: SEED_SAMPLE_EMPLOYEES
        value: "true"
      - key: SEED_SAMPLE_EMPLOYEES_COUNT
        value: "30"
      - key: GEMINI_API_KEY
        sync: false                              # set manually in dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: tms-frontend
          property: host                         # CorsConfig auto-prepends https://

  - type: web
    name: tms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: tms-backend
          property: host                         # axios.js prepends https://
