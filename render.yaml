# Render Blueprint — one-click deploy:
#   1. Push this repo to GitHub
#   2. Visit https://render.com → New → Blueprint → connect repo
#   3. Render auto-creates: backend (Docker), frontend (static), Postgres
#
# Free tier limits: backend sleeps after 15min idle (cold start ~30-60s on wake),
# Postgres free for 90 days then needs upgrade.
#
# After Postgres is created, Render fills DB_HOST/DB_PORT/etc automatically.
# Set OPENAI_API_KEY manually in Render dashboard if you want AI suggestion.

databases:
  - name: tms-db
    databaseName: task_management_db
    user: postgres
    plan: free

services:
  - type: web
    name: tms-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api-docs
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: SERVER_PORT
        value: 5000
      - key: CACHE_TYPE
        value: none                              # skip Redis on free tier
      - key: DB_HOST
        fromDatabase: { name: tms-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: tms-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: tms-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: tms-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: tms-db, property: password }
      - key: JWT_SECRET
        generateValue: true                      # Render generates 32-char secret
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false                              # set manually in dashboard
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: tms-frontend
          property: host                         # CorsConfig auto-prepends https://

  - type: web
    name: tms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: tms-backend
          property: host                         # axios.js prepends https://
