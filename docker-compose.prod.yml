# Production overrides — use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Provides: HTTPS via Caddy, no exposed DB ports, restart policies, env from .env
services:
  postgres:
    restart: unless-stopped
    ports: !reset []        # do not expose 5432 to host
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}

  redis:
    restart: unless-stopped
    ports: !reset []        # do not expose 6379 to host

  backend:
    restart: unless-stopped
    ports: !reset []        # only Caddy reaches backend on internal network
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/task_management_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: redis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: https://${DOMAIN:?DOMAIN required}

  frontend:
    restart: unless-stopped
    ports: !reset []        # Caddy serves frontend; no host port

  caddy:
    image: caddy:2-alpine
    container_name: tms-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
