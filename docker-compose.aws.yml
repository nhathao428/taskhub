# Production override cho AWS EC2 — all-in-one, truy cập bằng IP công khai (HTTP).
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d
#
# Một server EC2 chạy tất cả: PostgreSQL + Redis + Spring Boot + React + Caddy.
# Khi đã có domain riêng → dùng docker-compose.prod.yml (HTTPS tự động) thay file này.
services:
  postgres:
    restart: unless-stopped
    ports: !reset []        # không expose 5432 ra ngoài
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}

  redis:
    restart: unless-stopped
    ports: !reset []        # không expose 6379 ra ngoài

  backend:
    restart: unless-stopped
    ports: !reset []        # chỉ Caddy truy cập backend qua mạng nội bộ
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/task_management_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: redis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CORS_ORIGINS: ${APP_URL:-http://localhost}

  frontend:
    restart: unless-stopped
    ports: !reset []        # Caddy phục vụ frontend; không mở port host

  caddy:
    image: caddy:2-alpine
    container_name: tms-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.aws:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
