<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arr-dash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="600" fill="white"/>

  <!-- Title -->
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Sequence Diagram — Quản lý Công việc (Tạo + Phân công)</text>

  <!-- Frames drawn FIRST -->
  <!-- Tạo công việc frame -->
  <rect x="20" y="118" width="880" height="195" fill="none" stroke="#8e44ad" stroke-width="1.5" rx="4" stroke-dasharray="6,3"/>
  <rect x="20" y="118" width="130" height="18" fill="#8e44ad" rx="2"/>
  <text x="28" y="131" font-size="10" font-weight="bold" fill="white">Tạo công việc mới</text>

  <!-- Phân công frame -->
  <rect x="20" y="330" width="880" height="235" fill="none" stroke="#2980b9" stroke-width="1.5" rx="4" stroke-dasharray="6,3"/>
  <rect x="20" y="330" width="200" height="18" fill="#2980b9" rx="2"/>
  <text x="28" y="343" font-size="10" font-weight="bold" fill="white">Phân công nhân viên cho công việc</text>

  <!-- Lifelines -->
  <line x1="80" y1="110" x2="80" y2="585" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="240" y1="110" x2="240" y2="585" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="430" y1="110" x2="430" y2="585" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="620" y1="110" x2="620" y2="585" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Participant boxes -->
  <rect x="30" y="50" width="100" height="55" fill="white" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="80" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Quản lý</text>
  <text x="80" y="89" text-anchor="middle" font-size="10" fill="#555">(Actor)</text>

  <rect x="190" y="50" width="100" height="55" fill="white" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="240" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Giao diện</text>
  <text x="240" y="89" text-anchor="middle" font-size="10" fill="#555">(Frontend)</text>

  <rect x="370" y="50" width="120" height="55" fill="white" stroke="#e67e22" stroke-width="2" rx="5"/>
  <text x="430" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">TaskController</text>
  <text x="430" y="82" text-anchor="middle" font-size="10" fill="#555">+ TaskService</text>
  <text x="430" y="96" text-anchor="middle" font-size="9" fill="#555">(Backend)</text>

  <rect x="570" y="50" width="100" height="55" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="620" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Cơ sở dữ liệu</text>
  <text x="620" y="89" text-anchor="middle" font-size="10" fill="#555">(MySQL)</text>

  <!-- === TẠO CÔNG VIỆC === -->
  <line x1="80" y1="152" x2="232" y2="152" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="156" y="144" text-anchor="middle" font-size="11" fill="#333">Điền thông tin công việc</text>

  <line x1="240" y1="175" x2="362" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="301" y="167" text-anchor="middle" font-size="11" fill="#333">POST /api/tasks</text>

  <rect x="370" y="182" width="120" height="20" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="2"/>
  <text x="430" y="195" text-anchor="middle" font-size="9" fill="#7d6608">Xác thực JWT (ADMIN role)</text>

  <line x1="430" y1="215" x2="612" y2="215" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="521" y="207" text-anchor="middle" font-size="10" fill="#333">INSERT task (status = PENDING)</text>

  <line x1="612" y1="233" x2="438" y2="233" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="525" y="226" text-anchor="middle" font-size="10" fill="#555">Xác nhận đã tạo</text>

  <line x1="430" y1="255" x2="248" y2="265" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="339" y="250" text-anchor="middle" font-size="10" fill="#8e44ad" font-weight="bold">201 Created — Task mới</text>

  <line x1="240" y1="278" x2="88" y2="288" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="164" y="273" text-anchor="middle" font-size="10" fill="#7d3c98">Hiển thị task trong danh sách</text>

  <!-- === PHÂN CÔNG === -->
  <line x1="80" y1="362" x2="232" y2="362" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="156" y="354" text-anchor="middle" font-size="11" fill="#333">Chọn task + chọn nhân viên</text>

  <line x1="240" y1="385" x2="362" y2="385" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="301" y="377" text-anchor="middle" font-size="11" fill="#333">PUT /api/tasks/{id}</text>
  <text x="301" y="393" text-anchor="middle" font-size="9" fill="#555">{assignedTo: employeeId}</text>

  <rect x="370" y="402" width="120" height="20" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="2"/>
  <text x="430" y="415" text-anchor="middle" font-size="9" fill="#7d6608">Xác thực JWT (ADMIN role)</text>

  <line x1="430" y1="435" x2="612" y2="435" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="521" y="427" text-anchor="middle" font-size="10" fill="#333">Kiểm tra task + nhân viên hợp lệ</text>

  <line x1="612" y1="452" x2="438" y2="452" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="525" y="445" text-anchor="middle" font-size="9" fill="#555">Dữ liệu hợp lệ</text>

  <line x1="430" y1="472" x2="612" y2="472" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="521" y="464" text-anchor="middle" font-size="10" fill="#333">UPDATE task.assigned_to = employeeId</text>

  <line x1="612" y1="489" x2="438" y2="489" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="525" y="482" text-anchor="middle" font-size="9" fill="#555">Đã cập nhật</text>

  <line x1="430" y1="509" x2="248" y2="518" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="339" y="503" text-anchor="middle" font-size="10" fill="#2980b9" font-weight="bold">200 OK — Đã phân công</text>

  <line x1="240" y1="530" x2="88" y2="538" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="164" y="525" text-anchor="middle" font-size="10" fill="#2980b9">Cập nhật giao diện: task đã gán NV</text>
</svg>
