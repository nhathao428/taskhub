<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arr-dash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="660" fill="white"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Sequence Diagram — Chấm công (Check-in / Check-out)</text>

  <!-- Loop/alt frames drawn FIRST so lifelines appear on top -->
  <!-- CHECK-IN frame -->
  <rect x="20" y="120" width="860" height="240" fill="none" stroke="#27ae60" stroke-width="1.5" rx="4" stroke-dasharray="6,3"/>
  <rect x="20" y="120" width="165" height="18" fill="#27ae60" rx="2"/>
  <text x="28" y="133" font-size="10" font-weight="bold" fill="white">loop [Chấm công vào — Check-in]</text>

  <!-- alt sub-frame inside check-in -->
  <rect x="170" y="248" width="700" height="100" fill="none" stroke="#2980b9" stroke-width="1" rx="3" stroke-dasharray="4,3"/>
  <rect x="170" y="248" width="130" height="16" fill="#2980b9" rx="2"/>
  <text x="178" y="260" font-size="9" font-weight="bold" fill="white">alt [Chưa chấm công]</text>
  <text x="178" y="305" font-size="9" font-weight="bold" fill="#e74c3c">else [Đã chấm rồi]</text>

  <!-- CHECK-OUT frame -->
  <rect x="20" y="385" width="860" height="240" fill="none" stroke="#2980b9" stroke-width="1.5" rx="4" stroke-dasharray="6,3"/>
  <rect x="20" y="385" width="165" height="18" fill="#2980b9" rx="2"/>
  <text x="28" y="398" font-size="10" font-weight="bold" fill="white">loop [Chấm công ra — Check-out]</text>

  <!-- Lifelines -->
  <line x1="80" y1="110" x2="80" y2="645" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="240" y1="110" x2="240" y2="645" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="430" y1="110" x2="430" y2="645" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="620" y1="110" x2="620" y2="645" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Participant boxes -->
  <rect x="30" y="50" width="100" height="55" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="80" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Nhân viên</text>
  <text x="80" y="89" text-anchor="middle" font-size="10" fill="#555">(Actor)</text>

  <rect x="190" y="50" width="100" height="55" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="240" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Giao diện</text>
  <text x="240" y="89" text-anchor="middle" font-size="10" fill="#555">(Frontend)</text>

  <rect x="365" y="50" width="130" height="55" fill="white" stroke="#e67e22" stroke-width="2" rx="5"/>
  <text x="430" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">AttendanceController</text>
  <text x="430" y="82" text-anchor="middle" font-size="10" fill="#555">+ AttendanceService</text>
  <text x="430" y="96" text-anchor="middle" font-size="9" fill="#555">(Backend)</text>

  <rect x="570" y="50" width="100" height="55" fill="white" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="620" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Cơ sở dữ liệu</text>
  <text x="620" y="89" text-anchor="middle" font-size="10" fill="#555">(MySQL)</text>

  <!-- === CHECK-IN === -->
  <line x1="80" y1="152" x2="232" y2="152" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="156" y="144" text-anchor="middle" font-size="11" fill="#333">Nhấn "Chấm công vào"</text>

  <line x1="240" y1="175" x2="362" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="301" y="167" text-anchor="middle" font-size="10" fill="#333">POST /api/attendance/checkin</text>

  <!-- JWT note -->
  <rect x="365" y="182" width="130" height="20" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="2"/>
  <text x="430" y="195" text-anchor="middle" font-size="9" fill="#7d6608">Xác thực JWT Token</text>

  <line x1="430" y1="215" x2="612" y2="215" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="521" y="207" text-anchor="middle" font-size="10" fill="#333">Kiểm tra đã chấm công hôm nay?</text>

  <line x1="612" y1="232" x2="438" y2="232" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="525" y="224" text-anchor="middle" font-size="10" fill="#555">Trả kết quả</text>

  <!-- alt: chưa chấm -->
  <line x1="430" y1="270" x2="612" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="521" y="262" text-anchor="middle" font-size="10" fill="#333">INSERT attendance (ngày + giờ vào)</text>

  <line x1="612" y1="287" x2="438" y2="287" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="525" y="280" text-anchor="middle" font-size="10" fill="#555">Đã lưu</text>

  <line x1="430" y1="305" x2="248" y2="315" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="339" y="300" text-anchor="middle" font-size="10" fill="#27ae60" font-weight="bold">200 OK — Đã chấm công vào</text>

  <line x1="240" y1="330" x2="88" y2="338" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="164" y="325" text-anchor="middle" font-size="10" fill="#27ae60">Hiển thị: Đã chấm công vào</text>

  <!-- else: đã chấm -->
  <line x1="430" y1="355" x2="248" y2="355" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="339" y="347" text-anchor="middle" font-size="10" fill="#e74c3c" font-weight="bold">400 — Đã chấm công rồi!</text>

  <!-- === CHECK-OUT === -->
  <line x1="80" y1="415" x2="232" y2="415" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="156" y="407" text-anchor="middle" font-size="11" fill="#333">Nhấn "Chấm công ra"</text>

  <line x1="240" y1="438" x2="362" y2="438" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="301" y="430" text-anchor="middle" font-size="10" fill="#333">POST /api/attendance/checkout</text>

  <rect x="365" y="445" width="130" height="20" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="2"/>
  <text x="430" y="458" text-anchor="middle" font-size="9" fill="#7d6608">Xác thực JWT Token</text>

  <line x1="430" y1="478" x2="612" y2="478" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="521" y="470" text-anchor="middle" font-size="10" fill="#333">Tìm bản ghi chấm công vào hôm nay</text>

  <line x1="612" y1="495" x2="438" y2="495" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="525" y="488" text-anchor="middle" font-size="10" fill="#555">Bản ghi tìm thấy</text>

  <line x1="430" y1="515" x2="612" y2="515" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="521" y="508" text-anchor="middle" font-size="10" fill="#333">UPDATE checkOut = giờ hiện tại</text>

  <line x1="612" y1="532" x2="438" y2="532" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="525" y="525" text-anchor="middle" font-size="10" fill="#555">Đã cập nhật</text>

  <line x1="430" y1="552" x2="248" y2="560" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="339" y="546" text-anchor="middle" font-size="10" fill="#2980b9" font-weight="bold">200 OK — Đã chấm công ra</text>

  <line x1="240" y1="572" x2="88" y2="580" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="164" y="567" text-anchor="middle" font-size="10" fill="#2980b9">Hiển thị: Đã chấm công ra</text>
</svg>
