<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#f8f9fa" rx="8"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2c3e50">Sequence Diagram — Chấm công (Check-in / Check-out)</text>

  <!-- Lifeline headers -->
  <rect x="30" y="50" width="100" height="50" fill="#27ae60" stroke="#1e8449" stroke-width="2" rx="5"/>
  <text x="80" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Nhân viên</text>
  <text x="80" y="88" text-anchor="middle" font-size="10" fill="#a9dfbf">(Actor)</text>

  <rect x="185" y="50" width="110" height="50" fill="#27ae60" stroke="#1e8449" stroke-width="2" rx="5"/>
  <text x="240" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Giao diện</text>
  <text x="240" y="88" text-anchor="middle" font-size="10" fill="#a9dfbf">(Frontend)</text>

  <rect x="355" y="50" width="130" height="50" fill="#e67e22" stroke="#ca6f1e" stroke-width="2" rx="5"/>
  <text x="420" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="white">AttendanceController</text>
  <text x="420" y="84" text-anchor="middle" font-size="10" fill="#fdebd0">+ AttendanceService</text>
  <text x="420" y="97" text-anchor="middle" font-size="9" fill="#fdebd0">(Backend)</text>

  <rect x="550" y="50" width="110" height="50" fill="#8e44ad" stroke="#7d3c98" stroke-width="2" rx="5"/>
  <text x="605" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Cơ sở dữ liệu</text>
  <text x="605" y="88" text-anchor="middle" font-size="10" fill="#d2b4de">(MySQL)</text>

  <!-- Lifelines -->
  <line x1="80" y1="100" x2="80" y2="620" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="240" y1="100" x2="240" y2="620" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="420" y1="100" x2="420" y2="620" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="605" y1="100" x2="605" y2="620" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- === CHECK-IN === -->
  <rect x="30" y="118" width="840" height="240" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5" rx="5" stroke-dasharray="7,3"/>
  <text x="48" y="136" font-size="12" font-weight="bold" fill="#1e8449">loop [Chấm công vào — Check-in]</text>

  <line x1="80" y1="148" x2="230" y2="148" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="155" y="140" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">Nhấn "Chấm công vào"</text>

  <line x1="240" y1="168" x2="350" y2="168" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="295" y="160" text-anchor="middle" font-size="11" fill="#1a252f">POST /api/attendance/checkin</text>

  <rect x="355" y="175" width="140" height="22" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="3"/>
  <text x="425" y="190" text-anchor="middle" font-size="9" fill="#7d6608">Xác thực JWT Token</text>

  <line x1="420" y1="210" x2="595" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="507" y="202" text-anchor="middle" font-size="10" fill="#1a252f">Kiểm tra đã chấm công hôm nay?</text>

  <line x1="595" y1="228" x2="430" y2="228" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="512" y="220" text-anchor="middle" font-size="10" fill="#555">Trả kết quả</text>

  <!-- Alt: chưa chấm -->
  <rect x="355" y="240" width="510" height="100" fill="white" stroke="#aed6f1" stroke-width="1" rx="3"/>
  <text x="370" y="256" font-size="10" font-weight="bold" fill="#2980b9">alt [Chưa chấm công hôm nay]</text>

  <line x1="420" y1="268" x2="595" y2="268" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="507" y="261" text-anchor="middle" font-size="10" fill="#1a252f">INSERT attendance (ngày + giờ vào)</text>

  <line x1="595" y1="285" x2="430" y2="285" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="512" y="278" text-anchor="middle" font-size="10" fill="#555">Đã lưu</text>

  <line x1="420" y1="305" x2="250" y2="318" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="335" y="305" text-anchor="middle" font-size="10" fill="#27ae60" font-weight="bold">200 OK — Đã chấm công vào</text>

  <line x1="240" y1="330" x2="90" y2="340" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="165" y="325" text-anchor="middle" font-size="10" fill="#1e8449">Hiển thị: Đã chấm công vào</text>

  <!-- Alt: đã chấm -->
  <text x="370" y="354" font-size="10" font-weight="bold" fill="#c0392b">else [Đã chấm công rồi]</text>
  <line x1="420" y1="365" x2="250" y2="365" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="335" y="358" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">400 — Đã chấm công rồi!</text>

  <!-- === CHECK-OUT === -->
  <rect x="30" y="380" width="840" height="220" fill="#eaf4fb" stroke="#2980b9" stroke-width="1.5" rx="5" stroke-dasharray="7,3"/>
  <text x="48" y="398" font-size="12" font-weight="bold" fill="#2980b9">loop [Chấm công ra — Check-out]</text>

  <line x1="80" y1="410" x2="230" y2="410" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="155" y="402" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">Nhấn "Chấm công ra"</text>

  <line x1="240" y1="430" x2="350" y2="430" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="295" y="422" text-anchor="middle" font-size="11" fill="#1a252f">POST /api/attendance/checkout</text>

  <rect x="355" y="438" width="140" height="22" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="3"/>
  <text x="425" y="453" text-anchor="middle" font-size="9" fill="#7d6608">Xác thực JWT Token</text>

  <line x1="420" y1="472" x2="595" y2="472" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="507" y="464" text-anchor="middle" font-size="10" fill="#1a252f">Tìm bản ghi chấm công vào hôm nay</text>

  <line x1="595" y1="490" x2="430" y2="490" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="512" y="483" text-anchor="middle" font-size="10" fill="#555">Bản ghi tìm thấy</text>

  <line x1="420" y1="510" x2="595" y2="510" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="507" y="503" text-anchor="middle" font-size="10" fill="#1a252f">UPDATE checkOut = giờ hiện tại</text>

  <line x1="595" y1="528" x2="430" y2="528" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="512" y="521" text-anchor="middle" font-size="10" fill="#555">Đã cập nhật</text>

  <line x1="420" y1="548" x2="250" y2="558" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="335" y="545" text-anchor="middle" font-size="10" fill="#2980b9" font-weight="bold">200 OK — Đã chấm công ra</text>

  <line x1="240" y1="570" x2="90" y2="580" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="165" y="566" text-anchor="middle" font-size="10" fill="#2980b9">Hiển thị: Đã chấm công ra</text>
</svg>
