<svg xmlns="http://www.w3.org/2000/svg" width="650" height="760" viewBox="0 0 650 760" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect width="650" height="760" fill="#f8f9fa" rx="8"/>
  <text x="325" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">Activity Diagram — AI Gợi ý Nhân viên</text>

  <!-- Start -->
  <circle cx="325" cy="58" r="16" fill="#2c3e50"/>
  <line x1="325" y1="74" x2="325" y2="94" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Action: Nhập yêu cầu -->
  <rect x="155" y="98" width="340" height="42" fill="#fdebd0" stroke="#e67e22" stroke-width="2" rx="20"/>
  <text x="325" y="114" text-anchor="middle" font-size="12" fill="#1a252f" font-weight="bold">Quản lý nhập thông tin yêu cầu</text>
  <text x="325" y="130" text-anchor="middle" font-size="10" fill="#555">{taskTitle, taskDescription, requiredSkills}</text>
  <line x1="325" y1="140" x2="325" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Action: Batch query -->
  <rect x="155" y="164" width="340" height="42" fill="#d6eaf8" stroke="#2980b9" stroke-width="2" rx="8"/>
  <text x="325" y="181" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">Batch query 4 bảng dữ liệu</text>
  <text x="325" y="196" text-anchor="middle" font-size="10" fill="#2980b9">findAll + Skills + Tasks + Attendance (30 ngày)</text>
  <line x1="325" y1="206" x2="325" y2="226" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision: OpenAI key? -->
  <polygon points="325,226 440,268 325,310 210,268" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="325" y="261" text-anchor="middle" font-size="11" fill="#7d3c00">OpenAI API</text>
  <text x="325" y="277" text-anchor="middle" font-size="11" fill="#7d3c00">Key cấu hình?</text>

  <!-- === BRANCH: CÓ KEY === -->
  <line x1="440" y1="268" x2="540" y2="268" stroke="#8e44ad" stroke-width="2" marker-end="url(#arr)"/>
  <text x="490" y="260" text-anchor="middle" font-size="11" fill="#8e44ad" font-weight="bold">Có</text>

  <rect x="520" y="288" width="120" height="40" fill="#e8daef" stroke="#8e44ad" stroke-width="2" rx="8"/>
  <text x="580" y="304" text-anchor="middle" font-size="10" fill="#4a235a" font-weight="bold">Xây dựng</text>
  <text x="580" y="318" text-anchor="middle" font-size="10" fill="#4a235a">prompt GPT</text>
  <line x1="580" y1="328" x2="580" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="520" y="354" width="120" height="40" fill="#e8daef" stroke="#8e44ad" stroke-width="2" rx="8"/>
  <text x="580" y="370" text-anchor="middle" font-size="10" fill="#4a235a" font-weight="bold">POST OpenAI</text>
  <text x="580" y="384" text-anchor="middle" font-size="10" fill="#4a235a">/v1/chat/completions</text>
  <line x1="580" y1="394" x2="580" y2="415" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="520" y="418" width="120" height="40" fill="#e8daef" stroke="#8e44ad" stroke-width="2" rx="8"/>
  <text x="580" y="434" text-anchor="middle" font-size="10" fill="#4a235a" font-weight="bold">Parse JSON</text>
  <text x="580" y="448" text-anchor="middle" font-size="10" fill="#4a235a">response</text>
  <line x1="580" y1="458" x2="580" y2="580" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="580" y1="580" x2="475" y2="580" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- === BRANCH: KHÔNG KEY (FALLBACK) === -->
  <line x1="210" y1="268" x2="110" y2="268" stroke="#27ae60" stroke-width="2" marker-end="url(#arr)"/>
  <text x="160" y="260" text-anchor="middle" font-size="11" fill="#27ae60" font-weight="bold">Không</text>

  <rect x="15" y="290" width="160" height="38" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="95" y="305" text-anchor="middle" font-size="10" fill="#1a5c2f" font-weight="bold">Tính điểm kỹ năng</text>
  <text x="95" y="319" text-anchor="middle" font-size="10" fill="#555">matchSkillScore × 35%</text>
  <line x1="95" y1="328" x2="95" y2="352" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="15" y="356" width="160" height="38" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="95" y="371" text-anchor="middle" font-size="10" fill="#1a5c2f" font-weight="bold">Điểm khối lượng</text>
  <text x="95" y="385" text-anchor="middle" font-size="10" fill="#555">workloadScore × 25%</text>
  <line x1="95" y1="394" x2="95" y2="418" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="15" y="422" width="160" height="38" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="95" y="437" text-anchor="middle" font-size="10" fill="#1a5c2f" font-weight="bold">Điểm hiệu suất</text>
  <text x="95" y="451" text-anchor="middle" font-size="10" fill="#555">performanceScore × 25%</text>
  <line x1="95" y1="460" x2="95" y2="484" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="15" y="488" width="160" height="38" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="95" y="503" text-anchor="middle" font-size="10" fill="#1a5c2f" font-weight="bold">Điểm chấm công</text>
  <text x="95" y="517" text-anchor="middle" font-size="10" fill="#555">attendanceScore × 15%</text>
  <line x1="95" y1="526" x2="95" y2="550" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="15" y="554" width="160" height="38" fill="#d5f5e3" stroke="#1e8449" stroke-width="2" rx="8"/>
  <text x="95" y="569" text-anchor="middle" font-size="10" fill="#1a5c2f" font-weight="bold">Tổng hợp overallScore</text>
  <text x="95" y="583" text-anchor="middle" font-size="10" fill="#555">Sắp xếp giảm dần</text>
  <line x1="95" y1="592" x2="95" y2="610" stroke="#333" stroke-width="2"/>
  <line x1="95" y1="610" x2="175" y2="610" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Merge point + Top 5 -->
  <rect x="155" y="570" width="320" height="42" fill="#1abc9c" stroke="#148f77" stroke-width="2" rx="8"/>
  <text x="315" y="587" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Lấy Top 5 ứng viên phù hợp nhất</text>
  <text x="315" y="602" text-anchor="middle" font-size="10" fill="#a2d9ce">Sắp xếp theo overallScore giảm dần</text>
  <line x1="315" y1="612" x2="315" y2="635" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Action: Trả kết quả -->
  <rect x="155" y="639" width="320" height="42" fill="#fdebd0" stroke="#e67e22" stroke-width="2" rx="20"/>
  <text x="315" y="655" text-anchor="middle" font-size="12" fill="#1a252f" font-weight="bold">Trả kết quả cho Quản lý</text>
  <text x="315" y="669" text-anchor="middle" font-size="10" fill="#555">Danh sách + lý do gợi ý + điểm số</text>
  <line x1="315" y1="681" x2="315" y2="702" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- End -->
  <circle cx="315" cy="714" r="12" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <circle cx="315" cy="714" r="7" fill="#2c3e50"/>
</svg>
