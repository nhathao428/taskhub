<svg xmlns="http://www.w3.org/2000/svg" width="700" height="780" viewBox="0 0 700 780" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a1a1a"/>
    </marker>
  </defs>
  <style>
    .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .activity { fill: #cce5ff; stroke: #1a1a1a; stroke-width: 1.5; }
    .activity-text { font-size: 12px; fill: #1a1a1a; text-anchor: middle; }
    .decision { fill: #fff8b3; stroke: #1a1a1a; stroke-width: 1.5; }
    .decision-text { font-size: 11px; fill: #1a1a1a; text-anchor: middle; font-weight: bold; }
    .label { font-size: 11px; fill: #555; font-style: italic; }
    .error-activity { fill: #ffe5e5; stroke: #c0392b; stroke-width: 1.5; }
    .fork-bar { fill: #1a1a1a; }
  </style>

  <text x="350" y="32" text-anchor="middle" class="title">Activity — AI Gợi ý Nhân viên</text>

  <!-- Initial node -->
  <circle cx="350" cy="65" r="10" fill="#1a1a1a"/>

  <!-- Receive request -->
  <rect x="240" y="100" width="220" height="40" rx="20" class="activity"/>
  <text x="350" y="124" class="activity-text">Nhận POST /api/suggestions/recommend</text>

  <!-- Decision: API key set? -->
  <polygon points="350,170 410,210 350,250 290,210" class="decision"/>
  <text x="350" y="207" class="decision-text">OPENAI_API_KEY</text>
  <text x="350" y="222" class="decision-text">đã set?</text>

  <!-- No branch: throw 422 -->
  <rect x="60" y="200" width="160" height="40" rx="20" class="error-activity"/>
  <text x="140" y="216" class="activity-text" font-weight="bold">Throw BusinessException</text>
  <text x="140" y="232" class="activity-text">→ HTTP 422</text>

  <!-- Yes: continue -->
  <text x="365" y="265" class="label">[có key]</text>
  <text x="220" y="195" class="label">[thiếu key]</text>

  <!-- Fetch employees -->
  <rect x="240" y="285" width="220" height="40" rx="20" class="activity"/>
  <text x="350" y="309" class="activity-text">Lấy danh sách nhân viên</text>

  <!-- Fork: parallel batch queries -->
  <rect x="180" y="350" width="340" height="6" class="fork-bar"/>

  <rect x="120" y="380" width="180" height="50" rx="20" class="activity"/>
  <text x="210" y="400" class="activity-text">Batch query Tasks</text>
  <text x="210" y="416" class="activity-text">(tiến độ + thời gian hoàn thành)</text>

  <rect x="400" y="380" width="180" height="50" rx="20" class="activity"/>
  <text x="490" y="400" class="activity-text">Batch query Attendance</text>
  <text x="490" y="416" class="activity-text">(30 ngày gần nhất)</text>

  <!-- Join -->
  <rect x="180" y="455" width="340" height="6" class="fork-bar"/>

  <!-- Aggregate stats -->
  <rect x="220" y="480" width="260" height="40" rx="20" class="activity"/>
  <text x="350" y="498" class="activity-text">Tổng hợp raw stats per employee</text>
  <text x="350" y="513" class="activity-text" font-size="10" fill="#555">(số task, đúng hạn, ngày làm việc)</text>

  <!-- Build prompt -->
  <rect x="240" y="545" width="220" height="40" rx="20" class="activity"/>
  <text x="350" y="563" class="activity-text">Build prompt tiếng Việt</text>
  <text x="350" y="578" class="activity-text" font-size="10" fill="#555">+ 3 tiêu chí ưu tiên</text>

  <!-- Call OpenAI -->
  <rect x="240" y="605" width="220" height="40" rx="20" class="activity"/>
  <text x="350" y="623" class="activity-text">Gọi OpenAI Chat API</text>
  <text x="350" y="638" class="activity-text" font-size="10" fill="#555">model gpt-4o-mini</text>

  <!-- Parse response -->
  <rect x="240" y="665" width="220" height="40" rx="20" class="activity"/>
  <text x="350" y="689" class="activity-text">Parse JSON → top 5 ranked</text>

  <!-- End node -->
  <circle cx="350" cy="735" r="12" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="350" cy="735" r="6" fill="#1a1a1a"/>

  <!-- Flows -->
  <line x1="350" y1="75" x2="350" y2="98" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="140" x2="350" y2="168" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="210" x2="222" y2="218" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="250" x2="350" y2="283" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="325" x2="350" y2="348" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Fork to parallel -->
  <line x1="210" y1="356" x2="210" y2="378" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="356" x2="490" y2="378" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Join from parallel -->
  <line x1="210" y1="430" x2="210" y2="453" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="430" x2="490" y2="453" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="350" y1="461" x2="350" y2="478" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="520" x2="350" y2="543" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="585" x2="350" y2="603" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="645" x2="350" y2="663" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="705" x2="350" y2="722" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
