<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .class-box { fill: white; stroke: #1a1a1a; stroke-width: 1.5; }
    .class-header { fill: #cce5ff; stroke: #1a1a1a; stroke-width: 1.5; }
    .class-name { font-size: 13px; font-weight: bold; fill: #1a1a1a; text-anchor: middle; }
    .stereotype { font-size: 10px; fill: #555; text-anchor: middle; font-style: italic; }
    .field-text { font-size: 11px; fill: #1a1a1a; }
    .method-text { font-size: 11px; fill: #555; }
    .rel-label { font-size: 10px; fill: #1a1a1a; font-style: italic; }
    .multiplicity { font-size: 10px; fill: #1a1a1a; font-style: italic; }
  </style>

  <text x="550" y="30" text-anchor="middle" class="title">Class Diagram — Thực thể (Entity)</text>

  <!-- NguoiDung -->
  <g id="NguoiDung">
    <rect x="40" y="60" width="200" height="190" class="class-box" rx="2"/>
    <rect x="40" y="60" width="200" height="38" class="class-header" rx="2"/>
    <text x="140" y="78" class="stereotype">«entity»</text>
    <text x="140" y="92" class="class-name">NguoiDung</text>
    <line x1="40" y1="98" x2="240" y2="98" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="48" y="115" class="field-text">- maNguoiDung: Long</text>
    <text x="48" y="131" class="field-text">- tenDangNhap: String</text>
    <text x="48" y="147" class="field-text">- matKhau: String</text>
    <text x="48" y="163" class="field-text">- email: String</text>
    <text x="48" y="179" class="field-text">- vaiTro: String</text>
    <text x="48" y="195" class="field-text">- ngayTao: LocalDateTime</text>
    <line x1="40" y1="203" x2="240" y2="203" stroke="#1a1a1a" stroke-width="1"/>
    <text x="48" y="219" class="method-text">+ getters/setters()</text>
    <text x="48" y="235" class="method-text">+ onCreate()</text>
  </g>

  <!-- NhanVien -->
  <g id="NhanVien">
    <rect x="290" y="60" width="220" height="210" class="class-box" rx="2"/>
    <rect x="290" y="60" width="220" height="38" class="class-header" rx="2"/>
    <text x="400" y="78" class="stereotype">«entity»</text>
    <text x="400" y="92" class="class-name">NhanVien</text>
    <line x1="290" y1="98" x2="510" y2="98" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="298" y="115" class="field-text">- maNhanVien: Long</text>
    <text x="298" y="131" class="field-text">- nguoiDung: NguoiDung</text>
    <text x="298" y="147" class="field-text">- ho: String</text>
    <text x="298" y="163" class="field-text">- ten: String</text>
    <text x="298" y="179" class="field-text">- chucVu: String</text>
    <text x="298" y="195" class="field-text">- phongBan: String</text>
    <text x="298" y="211" class="field-text">- nhom: String</text>
    <text x="298" y="227" class="field-text">- ngayVaoLam: LocalDateTime</text>
    <line x1="290" y1="235" x2="510" y2="235" stroke="#1a1a1a" stroke-width="1"/>
    <text x="298" y="251" class="method-text">+ getters/setters()</text>
    <text x="298" y="265" class="method-text">+ onCreate()</text>
  </g>

  <!-- DuAn -->
  <g id="DuAn">
    <rect x="560" y="60" width="200" height="190" class="class-box" rx="2"/>
    <rect x="560" y="60" width="200" height="38" class="class-header" rx="2"/>
    <text x="660" y="78" class="stereotype">«entity»</text>
    <text x="660" y="92" class="class-name">DuAn</text>
    <line x1="560" y1="98" x2="760" y2="98" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="568" y="115" class="field-text">- maDuAn: Long</text>
    <text x="568" y="131" class="field-text">- tenDuAn: String</text>
    <text x="568" y="147" class="field-text">- moTa: String</text>
    <text x="568" y="163" class="field-text">- ngayBatDau: LocalDate</text>
    <text x="568" y="179" class="field-text">- ngayKetThuc: LocalDate</text>
    <text x="568" y="195" class="field-text">- trangThai: String</text>
    <text x="568" y="211" class="field-text">- nhom: String</text>
    <line x1="560" y1="219" x2="760" y2="219" stroke="#1a1a1a" stroke-width="1"/>
    <text x="568" y="235" class="method-text">+ getters/setters()</text>
  </g>

  <!-- CongViec -->
  <g id="CongViec">
    <rect x="810" y="60" width="260" height="225" class="class-box" rx="2"/>
    <rect x="810" y="60" width="260" height="38" class="class-header" rx="2"/>
    <text x="940" y="78" class="stereotype">«entity»</text>
    <text x="940" y="92" class="class-name">CongViec</text>
    <line x1="810" y1="98" x2="1070" y2="98" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="818" y="115" class="field-text">- maCongViec: Long</text>
    <text x="818" y="131" class="field-text">- duAn: DuAn</text>
    <text x="818" y="147" class="field-text">- nguoiDuocGiao: NhanVien</text>
    <text x="818" y="163" class="field-text">- tieuDe: String</text>
    <text x="818" y="179" class="field-text">- moTa: String</text>
    <text x="818" y="195" class="field-text">- hanHoanThanh: LocalDate</text>
    <text x="818" y="211" class="field-text">- trangThai: String</text>
    <text x="818" y="227" class="field-text">- thoiDiemHoanThanh: LocalDateTime</text>
    <line x1="810" y1="235" x2="1070" y2="235" stroke="#1a1a1a" stroke-width="1"/>
    <text x="818" y="251" class="method-text">+ getters/setters()</text>
  </g>

  <!-- ChamCong -->
  <g id="ChamCong">
    <rect x="120" y="430" width="220" height="170" class="class-box" rx="2"/>
    <rect x="120" y="430" width="220" height="38" class="class-header" rx="2"/>
    <text x="230" y="448" class="stereotype">«entity»</text>
    <text x="230" y="462" class="class-name">ChamCong</text>
    <line x1="120" y1="468" x2="340" y2="468" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="128" y="485" class="field-text">- maChamCong: Long</text>
    <text x="128" y="501" class="field-text">- nhanVien: NhanVien</text>
    <text x="128" y="517" class="field-text">- ngay: LocalDate</text>
    <text x="128" y="533" class="field-text">- gioVao: LocalTime</text>
    <text x="128" y="549" class="field-text">- gioRa: LocalTime</text>
    <line x1="120" y1="557" x2="340" y2="557" stroke="#1a1a1a" stroke-width="1"/>
    <text x="128" y="573" class="method-text">+ getters/setters()</text>
  </g>

  <!-- GoiY -->
  <g id="GoiY">
    <rect x="700" y="430" width="240" height="170" class="class-box" rx="2"/>
    <rect x="700" y="430" width="240" height="38" class="class-header" rx="2"/>
    <text x="820" y="448" class="stereotype">«entity»</text>
    <text x="820" y="462" class="class-name">GoiY</text>
    <line x1="700" y1="468" x2="940" y2="468" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="708" y="485" class="field-text">- maGoiY: Long</text>
    <text x="708" y="501" class="field-text">- nguoiDung: NguoiDung</text>
    <text x="708" y="517" class="field-text">- noiDungGoiY: String</text>
    <text x="708" y="533" class="field-text">- phanHoi: String</text>
    <text x="708" y="549" class="field-text">- ngayTao: LocalDateTime</text>
    <line x1="700" y1="557" x2="940" y2="557" stroke="#1a1a1a" stroke-width="1"/>
    <text x="708" y="573" class="method-text">+ getters/setters()</text>
  </g>

  <!-- Relationships -->
  <!-- NhanVien * → 1 NguoiDung -->
  <line x1="290" y1="155" x2="240" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="248" y="148" class="multiplicity">1</text>
  <text x="270" y="148" class="multiplicity">*</text>
  <text x="245" y="170" class="rel-label">— có tài khoản —</text>

  <!-- CongViec * → 1 DuAn -->
  <line x1="810" y1="135" x2="760" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="765" y="128" class="multiplicity">1</text>
  <text x="800" y="128" class="multiplicity">*</text>
  <text x="755" y="150" class="rel-label">— thuộc dự án —</text>

  <!-- CongViec * → 0..1 NhanVien (curved) -->
  <path d="M 880 285 L 880 380 L 400 380 L 400 270" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <text x="888" y="300" class="multiplicity">*</text>
  <text x="404" y="285" class="multiplicity">0..1</text>
  <text x="600" y="375" class="rel-label">— được phân công cho —</text>

  <!-- ChamCong * → 1 NhanVien -->
  <line x1="230" y1="430" x2="230" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="230" y1="395" x2="400" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="400" y1="395" x2="400" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="225" y="420" class="multiplicity">*</text>
  <text x="404" y="285" class="multiplicity">1</text>
  <text x="280" y="390" class="rel-label">— ghi nhận chấm công —</text>

  <!-- GoiY * → 1 NguoiDung -->
  <line x1="820" y1="430" x2="820" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="820" y1="380" x2="140" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="140" y1="380" x2="140" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="815" y="420" class="multiplicity">*</text>
  <text x="145" y="265" class="multiplicity">1</text>
  <text x="450" y="375" class="rel-label">— người tạo —</text>

  <!-- Legend -->
  <rect x="40" y="630" width="500" height="65" fill="white" stroke="#1a1a1a" stroke-width="1" rx="3"/>
  <text x="50" y="650" font-size="12" font-weight="bold" fill="#1a1a1a">Chú thích:</text>
  <line x1="50" y1="660" x2="80" y2="660" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="86" y="664" font-size="11" fill="#1a1a1a">Association (* / 1 / 0..1 = multiplicity)</text>
  <rect x="50" y="673" width="20" height="14" class="class-header"/>
  <text x="78" y="685" font-size="11" fill="#1a1a1a">«entity» — JPA Entity ánh xạ bảng PostgreSQL</text>
</svg>
