    <text x="575" y="436" font-size="10" fill="#f1948a">«entity»</text>
    <line x1="570" y1="452" x2="790" y2="452" stroke="#c0392b" stroke-width="1"/>
    <text x="580" y="469" font-size="11" fill="#1a252f">- maGoiY: Long</text>
    <text x="580" y="485" font-size="11" fill="#1a252f">- nguoiDung: NguoiDung</text>
    <text x="580" y="501" font-size="11" fill="#1a252f">- noiDungGoiY: String</text>
    <text x="580" y="517" font-size="11" fill="#1a252f">- phanHoi: String</text>
    <text x="580" y="533" font-size="11" fill="#1a252f">- ngayTao: LocalDateTime</text>
    <line x1="570" y1="542" x2="790" y2="542" stroke="#f1948a" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="580" y="558" font-size="11" fill="#555">+ getters/setters</text>
    <text x="580" y="574" font-size="11" fill="#555">+ khởiTạoMặcĐịnh()</text>
  </g>

  <!-- Relationships -->
  <!-- NhanVien *-->1 NguoiDung -->
  <line x1="280" y1="140" x2="230" y2="140" stroke="#2980b9" stroke-width="2"/>
  <polygon points="230,136 220,140 230,144" fill="#2980b9"/>
  <text x="238" y="130" font-size="10" fill="#555" font-style="italic">1</text>
  <text x="268" y="130" font-size="10" fill="#555" font-style="italic">*</text>
  <text x="235" y="155" font-size="10" fill="#2980b9">liên kết TK</text>

  <!-- CongViec *-->1 DuAn -->
  <line x1="810" y1="120" x2="750" y2="120" stroke="#27ae60" stroke-width="2"/>
  <polygon points="750,116 740,120 750,124" fill="#27ae60"/>
  <text x="758" y="112" font-size="10" fill="#555" font-style="italic">1</text>
  <text x="798" y="112" font-size="10" fill="#555" font-style="italic">*</text>
  <text x="752" y="135" font-size="10" fill="#27ae60">thuộc dự án</text>

  <!-- CongViec *-->0..1 NhanVien -->
  <line x1="870" y1="280" x2="870" y2="340" stroke="#8e44ad" stroke-width="2"/>
  <line x1="870" y1="340" x2="385" y2="340" stroke="#8e44ad" stroke-width="2"/>
  <line x1="385" y1="340" x2="385" y2="260" stroke="#8e44ad" stroke-width="2"/>
  <polygon points="381,260 385,250 389,260" fill="#8e44ad"/>
  <text x="390" y="270" font-size="10" fill="#555" font-style="italic">0..1</text>
  <text x="860" y="295" font-size="10" fill="#555" font-style="italic">*</text>
  <text x="520" y="332" font-size="10" fill="#8e44ad">được phân công</text>

  <!-- ChamCong *-->1 NhanVien -->
  <line x1="130" y1="420" x2="130" y2="380" stroke="#e67e22" stroke-width="2"/>
  <line x1="130" y1="380" x2="385" y2="380" stroke="#e67e22" stroke-width="2"/>
  <line x1="385" y1="380" x2="385" y2="260" stroke="#e67e22" stroke-width="2"/>
  <polygon points="381,260 385,250 389,260" fill="#e67e22"/>
  <text x="390" y="278" font-size="10" fill="#555" font-style="italic">1</text>
  <text x="120" y="410" font-size="10" fill="#555" font-style="italic">*</text>
  <text x="200" y="377" font-size="10" fill="#e67e22">ghi nhận CC</text>

  <!-- KyNang *-->1 NhanVien -->
  <line x1="400" y1="420" x2="400" y2="395" stroke="#e67e22" stroke-width="2"/>
  <line x1="400" y1="395" x2="385" y2="395" stroke="#e67e22" stroke-width="2"/>
  <line x1="385" y1="395" x2="385" y2="260" stroke="#e67e22" stroke-width="2"/>
  <polygon points="381,260 385,250 389,260" fill="#e67e22"/>
  <text x="390" y="290" font-size="10" fill="#555" font-style="italic">1</text>
  <text x="390" y="410" font-size="10" fill="#555" font-style="italic">*</text>
  <text x="410" y="408" font-size="10" fill="#e67e22">sở hữu</text>

  <!-- GoiY *-->1 NguoiDung -->
  <line x1="680" y1="420" x2="680" y2="405" stroke="#c0392b" stroke-width="2"/>
  <line x1="680" y1="405" x2="130" y2="405" stroke="#c0392b" stroke-width="2"/>
  <line x1="130" y1="405" x2="130" y2="240" stroke="#c0392b" stroke-width="2"/>
  <polygon points="126,240 130,230 134,240" fill="#c0392b"/>
  <text x="135" y="245" font-size="10" fill="#555" font-style="italic">1</text>
  <text x="668" y="415" font-size="10" fill="#555" font-style="italic">*</text>
  <text x="350" y="400" font-size="10" fill="#c0392b">người tạo</text>

  <!-- Legend -->
  <rect x="820" y="420" width="260" height="130" fill="white" stroke="#bdc3c7" stroke-width="1.5" rx="5"/>
  <text x="950" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Chú thích</text>
  <rect x="835" y="450" width="20" height="14" fill="#2980b9" rx="2"/>
  <text x="862" y="462" font-size="11" fill="#333">Entity: User / Employee</text>
  <rect x="835" y="470" width="20" height="14" fill="#27ae60" rx="2"/>
  <text x="862" y="482" font-size="11" fill="#333">Entity: Project</text>
  <rect x="835" y="490" width="20" height="14" fill="#8e44ad" rx="2"/>
  <text x="862" y="502" font-size="11" fill="#333">Entity: Task</text>
  <rect x="835" y="510" width="20" height="14" fill="#e67e22" rx="2"/>
  <text x="862" y="522" font-size="11" fill="#333">Entity: Attendance / Skill</text>
  <rect x="835" y="530" width="20" height="14" fill="#c0392b" rx="2"/>
  <text x="862" y="542" font-size="11" fill="#333">Entity: Suggestion</text>
</svg>
