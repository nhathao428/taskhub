    <rect x="550" y="55" width="200" height="32" fill="#27ae60" rx="4"/>
    <text x="650" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="white">DuAn</text>
    <text x="555" y="71" font-size="10" fill="#a9dfbf">«entity»</text>
    <line x1="550" y1="87" x2="750" y2="87" stroke="#27ae60" stroke-width="1"/>
    <text x="560" y="104" font-size="11" fill="#1a252f">- maDuAn: Long</text>
    <text x="560" y="120" font-size="11" fill="#1a252f">- tenDuAn: String</text>
    <text x="560" y="136" font-size="11" fill="#1a252f">- moTa: String</text>
    <text x="560" y="152" font-size="11" fill="#1a252f">- ngayBatDau: LocalDate</text>
    <text x="560" y="168" font-size="11" fill="#1a252f">- ngayKetThuc: LocalDate</text>
    <text x="560" y="184" font-size="11" fill="#1a252f">- trangThai: String</text>
    <line x1="550" y1="192" x2="750" y2="192" stroke="#a9dfbf" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="560" y="208" font-size="11" fill="#555">+ getters/setters</text>
    <text x="560" y="224" font-size="11" fill="#555">+ toString()</text>
  </g>

  <!-- CongViec -->
  <g id="CongViec">
    <rect x="810" y="55" width="260" height="225" fill="white" stroke="#8e44ad" stroke-width="2" rx="4"/>
    <rect x="810" y="55" width="260" height="32" fill="#8e44ad" rx="4"/>
    <text x="940" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="white">CongViec</text>
    <text x="815" y="71" font-size="10" fill="#d2b4de">«entity»</text>
    <line x1="810" y1="87" x2="1070" y2="87" stroke="#8e44ad" stroke-width="1"/>
    <text x="820" y="104" font-size="11" fill="#1a252f">- maCongViec: Long</text>
    <text x="820" y="120" font-size="11" fill="#1a252f">- duAn: DuAn</text>
    <text x="820" y="136" font-size="11" fill="#1a252f">- nguoiDuocGiao: NhanVien</text>
    <text x="820" y="152" font-size="11" fill="#1a252f">- tieuDe: String</text>
    <text x="820" y="168" font-size="11" fill="#1a252f">- moTa: String</text>
    <text x="820" y="184" font-size="11" fill="#1a252f">- hanHoanThanh: LocalDate</text>
    <text x="820" y="200" font-size="11" fill="#1a252f">- trangThai: String</text>
    <text x="820" y="216" font-size="11" fill="#1a252f">- thoiDiemHoanThanh: LocalDateTime</text>
    <line x1="810" y1="224" x2="1070" y2="224" stroke="#d2b4de" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="820" y="240" font-size="11" fill="#555">+ getters/setters</text>
    <text x="820" y="256" font-size="11" fill="#555">+ toString()</text>
  </g>

  <!-- ChamCong -->
  <g id="ChamCong">
    <rect x="30" y="420" width="200" height="165" fill="white" stroke="#e67e22" stroke-width="2" rx="4"/>
    <rect x="30" y="420" width="200" height="32" fill="#e67e22" rx="4"/>
    <text x="130" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ChamCong</text>
    <text x="35" y="436" font-size="10" fill="#fad7a0">«entity»</text>
    <line x1="30" y1="452" x2="230" y2="452" stroke="#e67e22" stroke-width="1"/>
    <text x="40" y="469" font-size="11" fill="#1a252f">- maChamCong: Long</text>
    <text x="40" y="485" font-size="11" fill="#1a252f">- nhanVien: NhanVien</text>
    <text x="40" y="501" font-size="11" fill="#1a252f">- ngay: LocalDate</text>
    <text x="40" y="517" font-size="11" fill="#1a252f">- gioVao: LocalTime</text>
    <text x="40" y="533" font-size="11" fill="#1a252f">- gioRa: LocalTime</text>
    <line x1="30" y1="542" x2="230" y2="542" stroke="#fad7a0" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="40" y="558" font-size="11" fill="#555">+ getters/setters</text>
    <text x="40" y="574" font-size="11" fill="#555">+ toString()</text>
  </g>

  <!-- KyNang -->
  <g id="KyNang">
    <rect x="300" y="420" width="200" height="165" fill="white" stroke="#e67e22" stroke-width="2" rx="4"/>
    <rect x="300" y="420" width="200" height="32" fill="#e67e22" rx="4"/>
    <text x="400" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="white">KyNang</text>
    <text x="305" y="436" font-size="10" fill="#fad7a0">«entity»</text>
    <line x1="300" y1="452" x2="500" y2="452" stroke="#e67e22" stroke-width="1"/>
    <text x="310" y="469" font-size="11" fill="#1a252f">- maKyNang: Long</text>
    <text x="310" y="485" font-size="11" fill="#1a252f">- nhanVien: NhanVien</text>
    <text x="310" y="501" font-size="11" fill="#1a252f">- tenKyNang: String</text>
    <text x="310" y="517" font-size="11" fill="#1a252f">- mucDoThanhThao: String</text>
    <line x1="300" y1="525" x2="500" y2="525" stroke="#fad7a0" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="310" y="541" font-size="11" fill="#555">+ getters/setters</text>
    <text x="310" y="557" font-size="11" fill="#555">+ toString()</text>
  </g>

  <!-- GoiY -->
