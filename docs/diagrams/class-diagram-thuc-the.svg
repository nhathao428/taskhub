<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" font-family="Arial, sans-serif">
  <rect width="1100" height="800" fill="#f4f6f9" rx="8"/>
  <text x="550" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">Sơ đồ Lớp — Thực thể Hệ thống (Entity Class Diagram)</text>

  <!-- NguoiDung -->
  <g id="NguoiDung">
    <rect x="30" y="55" width="200" height="185" fill="white" stroke="#2980b9" stroke-width="2" rx="4"/>
    <rect x="30" y="55" width="200" height="32" fill="#2980b9" rx="4"/>
    <text x="130" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="white">NguoiDung</text>
    <text x="35" y="71" font-size="10" fill="#aed6f1">«entity»</text>
    <line x1="30" y1="87" x2="230" y2="87" stroke="#2980b9" stroke-width="1"/>
    <text x="40" y="104" font-size="11" fill="#1a252f">- maNguoiDung: Long</text>
    <text x="40" y="120" font-size="11" fill="#1a252f">- tenDangNhap: String</text>
    <text x="40" y="136" font-size="11" fill="#1a252f">- matKhau: String</text>
    <text x="40" y="152" font-size="11" fill="#1a252f">- email: String</text>
    <text x="40" y="168" font-size="11" fill="#1a252f">- vaiTro: String</text>
    <text x="40" y="184" font-size="11" fill="#1a252f">- ngayTao: LocalDateTime</text>
    <line x1="30" y1="192" x2="230" y2="192" stroke="#aed6f1" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="40" y="208" font-size="11" fill="#555">+ khởiTạoMặcĐịnh()</text>
    <text x="40" y="224" font-size="11" fill="#555">+ getters/setters</text>
  </g>

  <!-- NhanVien -->
  <g id="NhanVien">
    <rect x="280" y="55" width="210" height="205" fill="white" stroke="#2980b9" stroke-width="2" rx="4"/>
    <rect x="280" y="55" width="210" height="32" fill="#2980b9" rx="4"/>
    <text x="385" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="white">NhanVien</text>
    <text x="285" y="71" font-size="10" fill="#aed6f1">«entity»</text>
    <line x1="280" y1="87" x2="490" y2="87" stroke="#2980b9" stroke-width="1"/>
    <text x="290" y="104" font-size="11" fill="#1a252f">- maNhanVien: Long</text>
    <text x="290" y="120" font-size="11" fill="#1a252f">- nguoiDung: NguoiDung</text>
    <text x="290" y="136" font-size="11" fill="#1a252f">- ho: String</text>
    <text x="290" y="152" font-size="11" fill="#1a252f">- ten: String</text>
    <text x="290" y="168" font-size="11" fill="#1a252f">- chucVu: String</text>
    <text x="290" y="184" font-size="11" fill="#1a252f">- phongBan: String</text>
    <text x="290" y="200" font-size="11" fill="#1a252f">- ngayVaoLam: LocalDateTime</text>
    <line x1="280" y1="210" x2="490" y2="210" stroke="#aed6f1" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="290" y="226" font-size="11" fill="#555">+ getters/setters</text>
    <text x="290" y="242" font-size="11" fill="#555">+ khởiTạoMặcĐịnh()</text>
  </g>

  <!-- DuAn -->
  <g id="DuAn">
