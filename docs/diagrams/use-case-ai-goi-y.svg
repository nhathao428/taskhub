<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .system-label { font-size: 13px; font-weight: bold; fill: #1a1a1a; }
    .uc-text { font-size: 12px; fill: #1a1a1a; text-anchor: middle; }
    .uc-text-bold { font-size: 13px; font-weight: bold; fill: #1a1a1a; text-anchor: middle; }
    .actor-text { font-size: 12px; font-weight: bold; fill: #1a1a1a; text-anchor: middle; }
    .stereotype { font-size: 11px; fill: #555; font-style: italic; }
  </style>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" class="title">Use Case — AI Gợi ý Nhân viên</text>

  <!-- System boundary (StarUML: solid thin border, white fill) -->
  <rect x="200" y="60" width="500" height="430" fill="white" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
  <text x="450" y="82" text-anchor="middle" class="system-label">Hệ thống Quản lý Công việc</text>

  <!-- Use Case 1: Gửi yêu cầu gợi ý (entry point) -->
  <ellipse cx="450" cy="135" rx="130" ry="32" fill="#fffacd" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="450" y="131" class="uc-text-bold">Yêu cầu gợi ý</text>
  <text x="450" y="148" class="uc-text">nhân viên cho task</text>

  <!-- Use Case 2: Thu thập tiến độ task -->
  <ellipse cx="335" cy="240" rx="110" ry="30" fill="#fffacd" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="335" y="236" class="uc-text-bold">Thu thập tiến độ</text>
  <text x="335" y="252" class="uc-text">task trước</text>

  <!-- Use Case 3: Thu thập thời gian hoàn thành -->
  <ellipse cx="565" cy="240" rx="110" ry="30" fill="#fffacd" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="565" y="236" class="uc-text-bold">Thu thập thời gian</text>
  <text x="565" y="252" class="uc-text">hoàn thành</text>

  <!-- Use Case 4: Thu thập chấm công -->
  <ellipse cx="450" cy="335" rx="110" ry="30" fill="#fffacd" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="450" y="331" class="uc-text-bold">Thu thập chấm công</text>
  <text x="450" y="347" class="uc-text">30 ngày gần nhất</text>

  <!-- Use Case 5: Trả về top 5 + reasoning -->
  <ellipse cx="450" cy="430" rx="130" ry="32" fill="#fffacd" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="450" y="426" class="uc-text-bold">Trả về top 5</text>
  <text x="450" y="443" class="uc-text">+ reasoning từ AI</text>

  <!-- Actor: Manager (left) -->
  <circle cx="90" cy="170" r="14" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="184" x2="90" y2="226" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="68" y1="200" x2="112" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="226" x2="72" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="226" x2="108" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="270" class="actor-text">Manager / Admin</text>

  <!-- External actor: OpenAI -->
  <circle cx="810" cy="290" r="14" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="810" y1="304" x2="810" y2="346" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="788" y1="320" x2="832" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="810" y1="346" x2="792" y2="372" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="810" y1="346" x2="828" y2="372" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="810" y="390" class="actor-text">OpenAI GPT</text>
  <text x="810" y="406" class="stereotype" text-anchor="middle">«external»</text>

  <!-- Connection: Manager → Yêu cầu gợi ý -->
  <line x1="105" y1="180" x2="320" y2="135" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Include relationships (dashed) -->
  <line x1="380" y1="155" x2="370" y2="215" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="335" y="190" class="stereotype">«include»</text>

  <line x1="520" y1="155" x2="530" y2="215" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="540" y="190" class="stereotype">«include»</text>

  <line x1="450" y1="167" x2="450" y2="305" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="455" y="285" class="stereotype">«include»</text>

  <!-- Top 5 → result flow (dashed extend back to main use case) -->
  <line x1="335" y1="270" x2="420" y2="405" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="6,3"/>
  <line x1="565" y1="270" x2="480" y2="405" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="6,3"/>
  <line x1="450" y1="365" x2="450" y2="398" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="6,3"/>

  <!-- OpenAI connection (extend dependency to result) -->
  <line x1="795" y1="320" x2="580" y2="430" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="700" y="370" class="stereotype">«include»</text>
</svg>
