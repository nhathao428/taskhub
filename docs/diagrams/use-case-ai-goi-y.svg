<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" font-family="Arial, sans-serif">
  <rect width="900" height="550" fill="#f8f9fa" rx="8"/>
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">Sơ đồ Use Case — AI Gợi ý Nhân viên</text>

  <!-- System boundary -->
  <rect x="180" y="55" width="560" height="455" fill="white" stroke="#e67e22" stroke-width="2" rx="10" stroke-dasharray="8,4"/>
  <text x="460" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#e67e22">Hệ thống AI Gợi ý</text>

  <!-- Use Cases -->
  <ellipse cx="460" cy="130" rx="120" ry="30" fill="#fde8d8" stroke="#ca6f1e" stroke-width="2"/>
  <text x="460" y="125" text-anchor="middle" font-size="13" fill="#6e2f00" font-weight="bold">Yêu cầu gợi ý</text>
  <text x="460" y="142" text-anchor="middle" font-size="11" fill="#6e2f00">nhân viên phù hợp</text>

  <ellipse cx="335" cy="230" rx="100" ry="28" fill="#fde8d8" stroke="#ca6f1e" stroke-width="2"/>
  <text x="335" y="225" text-anchor="middle" font-size="12" fill="#6e2f00" font-weight="bold">Phân tích</text>
  <text x="335" y="241" text-anchor="middle" font-size="11" fill="#6e2f00">kỹ năng (35%)</text>

  <ellipse cx="585" cy="230" rx="100" ry="28" fill="#fde8d8" stroke="#ca6f1e" stroke-width="2"/>
  <text x="585" y="225" text-anchor="middle" font-size="12" fill="#6e2f00" font-weight="bold">Đánh giá khối</text>
  <text x="585" y="241" text-anchor="middle" font-size="11" fill="#6e2f00">lượng CV (25%)</text>

  <ellipse cx="335" cy="330" rx="100" ry="28" fill="#fde8d8" stroke="#ca6f1e" stroke-width="2"/>
  <text x="335" y="325" text-anchor="middle" font-size="12" fill="#6e2f00" font-weight="bold">Tính điểm</text>
  <text x="335" y="341" text-anchor="middle" font-size="11" fill="#6e2f00">hiệu suất (25%)</text>

  <ellipse cx="585" cy="330" rx="100" ry="28" fill="#fde8d8" stroke="#ca6f1e" stroke-width="2"/>
  <text x="585" y="325" text-anchor="middle" font-size="12" fill="#6e2f00" font-weight="bold">Kiểm tra</text>
  <text x="585" y="341" text-anchor="middle" font-size="11" fill="#6e2f00">chấm công (15%)</text>

  <ellipse cx="460" cy="430" rx="120" ry="30" fill="#fde8d8" stroke="#ca6f1e" stroke-width="2"/>
  <text x="460" y="425" text-anchor="middle" font-size="13" fill="#6e2f00" font-weight="bold">Trả về top 5</text>
  <text x="460" y="442" text-anchor="middle" font-size="11" fill="#6e2f00">nhân viên + lý do</text>

  <!-- Actor: Quản lý -->
  <circle cx="80" cy="175" r="20" fill="#fad7a0" stroke="#ca6f1e" stroke-width="2"/>
  <line x1="80" y1="195" x2="80" y2="245" stroke="#ca6f1e" stroke-width="2"/>
  <line x1="55" y1="217" x2="105" y2="217" stroke="#ca6f1e" stroke-width="2"/>
  <line x1="80" y1="245" x2="60" y2="273" stroke="#ca6f1e" stroke-width="2"/>
  <line x1="80" y1="245" x2="100" y2="273" stroke="#ca6f1e" stroke-width="2"/>
  <text x="80" y="292" text-anchor="middle" font-size="13" fill="#6e2f00" font-weight="bold">Quản lý</text>

  <!-- Actor: OpenAI / Hệ thống AI (right) -->
  <rect x="790" y="210" width="90" height="45" fill="#d5d8dc" stroke="#5d6d7e" stroke-width="2" rx="6"/>
  <text x="835" y="230" text-anchor="middle" font-size="11" fill="#1b2631" font-weight="bold">OpenAI</text>
  <text x="835" y="245" text-anchor="middle" font-size="10" fill="#1b2631">API</text>
  <text x="835" y="275" text-anchor="middle" font-size="11" fill="#5d6d7e">(Actor ngoài)</text>

  <!-- Connections -->
  <line x1="100" y1="175" x2="340" y2="133" stroke="#555" stroke-width="1.5"/>
  <line x1="460" y1="160" x2="460" y2="400" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="6,3"/>
  <!-- include arrows -->
  <line x1="460" y1="160" x2="335" y2="202" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="385" y="175" font-size="10" fill="#888" font-style="italic">«include»</text>
  <line x1="460" y1="160" x2="585" y2="202" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="525" y="175" font-size="10" fill="#888" font-style="italic">«include»</text>
  <line x1="460" y1="160" x2="335" y2="302" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="460" y1="160" x2="585" y2="302" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="335" y1="358" x2="460" y2="400" stroke="#888" stroke-width="1.5"/>
  <line x1="585" y1="358" x2="460" y2="400" stroke="#888" stroke-width="1.5"/>
  <line x1="335" y1="258" x2="460" y2="400" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="585" y1="258" x2="460" y2="400" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- OpenAI connection -->
  <line x1="790" y1="233" x2="685" y2="233" stroke="#5d6d7e" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="720" y="225" font-size="10" fill="#5d6d7e" font-style="italic">«extend»</text>
</svg>
