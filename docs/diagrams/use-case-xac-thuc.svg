<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" rx="8"/>
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">Sơ đồ Use Case — Xác thực Người dùng</text>
  <!-- System boundary -->
  <rect x="200" y="60" width="440" height="380" fill="white" stroke="#3498db" stroke-width="2" rx="10" stroke-dasharray="8,4"/>
  <text x="420" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#3498db">Hệ thống Xác thực</text>
  <!-- Use Case: Đăng ký -->
  <ellipse cx="420" cy="160" rx="90" ry="32" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="420" y="155" text-anchor="middle" font-size="13" fill="#1a5276" font-weight="bold">Đăng ký</text>
  <text x="420" y="172" text-anchor="middle" font-size="11" fill="#1a5276">tài khoản</text>
  <!-- Use Case: Đăng nhập -->
  <ellipse cx="420" cy="270" rx="90" ry="32" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="420" y="265" text-anchor="middle" font-size="13" fill="#1a5276" font-weight="bold">Đăng nhập</text>
  <text x="420" y="282" text-anchor="middle" font-size="11" fill="#1a5276">hệ thống</text>
  <!-- Use Case: Đăng xuất -->
  <ellipse cx="420" cy="380" rx="90" ry="32" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="420" y="375" text-anchor="middle" font-size="13" fill="#1a5276" font-weight="bold">Đăng xuất</text>
  <text x="420" y="392" text-anchor="middle" font-size="11" fill="#1a5276">hệ thống</text>
  <!-- Actor: Người dùng chưa đăng nhập -->
  <!-- Stick figure left -->
  <circle cx="90" cy="185" r="18" fill="#a9cce3" stroke="#2471a3" stroke-width="2"/>
  <line x1="90" y1="203" x2="90" y2="250" stroke="#2471a3" stroke-width="2"/>
  <line x1="65" y1="225" x2="115" y2="225" stroke="#2471a3" stroke-width="2"/>
  <line x1="90" y1="250" x2="70" y2="280" stroke="#2471a3" stroke-width="2"/>
  <line x1="90" y1="250" x2="110" y2="280" stroke="#2471a3" stroke-width="2"/>
  <text x="90" y="300" text-anchor="middle" font-size="11" fill="#1a5276" font-weight="bold">Người dùng</text>
  <text x="90" y="313" text-anchor="middle" font-size="11" fill="#1a5276">chưa đăng nhập</text>
  <!-- Actor: Người dùng đã đăng nhập -->
  <circle cx="90" cy="355" r="18" fill="#a9cce3" stroke="#2471a3" stroke-width="2"/>
  <line x1="90" y1="373" x2="90" y2="420" stroke="#2471a3" stroke-width="2"/>
  <line x1="65" y1="395" x2="115" y2="395" stroke="#2471a3" stroke-width="2"/>
  <line x1="90" y1="420" x2="70" y2="450" stroke="#2471a3" stroke-width="2"/>
  <line x1="90" y1="420" x2="110" y2="450" stroke="#2471a3" stroke-width="2"/>
  <text x="90" y="467" text-anchor="middle" font-size="11" fill="#1a5276" font-weight="bold">Người dùng</text>
  <text x="90" y="480" text-anchor="middle" font-size="11" fill="#1a5276">đã đăng nhập</text>
  <!-- Connection lines -->
  <line x1="108" y1="200" x2="330" y2="160" stroke="#555" stroke-width="1.5"/>
  <line x1="108" y1="210" x2="330" y2="270" stroke="#555" stroke-width="1.5"/>
  <line x1="108" y1="373" x2="330" y2="380" stroke="#555" stroke-width="1.5"/>
  <!-- Note: JWT Token -->
  <rect x="570" y="245" width="180" height="60" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5" rx="5"/>
  <text x="580" y="265" font-size="11" fill="#7d6608">Trả về JWT Token</text>
  <text x="580" y="280" font-size="11" fill="#7d6608">chứa username + role</text>
  <text x="580" y="295" font-size="11" fill="#7d6608">Hết hạn sau 24 giờ</text>
  <line x1="510" y1="270" x2="570" y2="270" stroke="#f39c12" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
