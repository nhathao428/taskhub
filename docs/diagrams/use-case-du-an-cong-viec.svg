<svg xmlns="http://www.w3.org/2000/svg" width="950" height="560" viewBox="0 0 950 560" font-family="Arial, sans-serif">
  <rect width="950" height="560" fill="white" rx="8"/>
  <text x="475" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">Sơ đồ Use Case — Quản lý Dự án &amp; Công việc</text>

  <!-- System boundary -->
  <rect x="180" y="55" width="590" height="470" fill="white" stroke="#8e44ad" stroke-width="2" rx="10" stroke-dasharray="8,4"/>
  <text x="475" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e44ad">Hệ thống Quản lý Dự án &amp; Công việc</text>

  <!-- Dự án sub-boundary -->
  <rect x="195" y="88" width="250" height="200" fill="#f5eef8" stroke="#a569bd" stroke-width="1.5" rx="8" stroke-dasharray="5,3"/>
  <text x="320" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#a569bd">Quản lý Dự án</text>

  <ellipse cx="320" cy="140" rx="80" ry="26" fill="#e8daef" stroke="#7d3c98" stroke-width="2"/>
  <text x="320" y="144" text-anchor="middle" font-size="12" fill="#4a235a" font-weight="bold">Tạo dự án</text>

  <ellipse cx="320" cy="200" rx="80" ry="26" fill="#e8daef" stroke="#7d3c98" stroke-width="2"/>
  <text x="320" y="204" text-anchor="middle" font-size="12" fill="#4a235a" font-weight="bold">Sửa dự án</text>

  <ellipse cx="320" cy="260" rx="80" ry="26" fill="#e8daef" stroke="#7d3c98" stroke-width="2"/>
  <text x="320" y="264" text-anchor="middle" font-size="12" fill="#4a235a" font-weight="bold">Xóa dự án</text>

  <!-- Công việc sub-boundary -->
  <rect x="465" y="88" width="280" height="320" fill="#eaf4fb" stroke="#2980b9" stroke-width="1.5" rx="8" stroke-dasharray="5,3"/>
  <text x="605" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2980b9">Quản lý Công việc</text>

  <ellipse cx="605" cy="145" rx="90" ry="26" fill="#d6eaf8" stroke="#1a5276" stroke-width="2"/>
  <text x="605" y="149" text-anchor="middle" font-size="12" fill="#1a5276" font-weight="bold">Tạo công việc</text>

  <ellipse cx="605" cy="210" rx="90" ry="26" fill="#d6eaf8" stroke="#1a5276" stroke-width="2"/>
  <text x="605" y="214" text-anchor="middle" font-size="12" fill="#1a5276" font-weight="bold">Phân công nhân viên</text>

  <ellipse cx="605" cy="275" rx="90" ry="26" fill="#d6eaf8" stroke="#1a5276" stroke-width="2"/>
  <text x="605" y="279" text-anchor="middle" font-size="12" fill="#1a5276" font-weight="bold">Xóa công việc</text>

  <ellipse cx="605" cy="345" rx="90" ry="26" fill="#d6eaf8" stroke="#1a5276" stroke-width="2"/>
  <text x="605" y="349" text-anchor="middle" font-size="12" fill="#1a5276" font-weight="bold">Xem công việc</text>

  <!-- Shared: Cập nhật tiến độ -->
  <ellipse cx="420" cy="445" rx="110" ry="28" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="420" y="440" text-anchor="middle" font-size="12" fill="#1a5c2f" font-weight="bold">Cập nhật</text>
  <text x="420" y="457" text-anchor="middle" font-size="12" fill="#1a5c2f" font-weight="bold">tiến độ công việc</text>

  <!-- Actor: Quản lý (left) -->
  <circle cx="70" cy="200" r="20" fill="white" stroke="#7d3c98" stroke-width="2"/>
  <line x1="70" y1="220" x2="70" y2="270" stroke="#7d3c98" stroke-width="2"/>
  <line x1="45" y1="242" x2="95" y2="242" stroke="#7d3c98" stroke-width="2"/>
  <line x1="70" y1="270" x2="50" y2="300" stroke="#7d3c98" stroke-width="2"/>
  <line x1="70" y1="270" x2="90" y2="300" stroke="#7d3c98" stroke-width="2"/>
  <text x="70" y="320" text-anchor="middle" font-size="13" fill="#4a235a" font-weight="bold">Quản lý</text>

  <!-- Actor: Nhân viên (right) -->
  <circle cx="880" cy="390" r="20" fill="white" stroke="#1e8449" stroke-width="2"/>
  <line x1="880" y1="410" x2="880" y2="460" stroke="#1e8449" stroke-width="2"/>
  <line x1="855" y1="430" x2="905" y2="430" stroke="#1e8449" stroke-width="2"/>
  <line x1="880" y1="460" x2="860" y2="488" stroke="#1e8449" stroke-width="2"/>
  <line x1="880" y1="460" x2="900" y2="488" stroke="#1e8449" stroke-width="2"/>
  <text x="880" y="507" text-anchor="middle" font-size="13" fill="#1a5c2f" font-weight="bold">Nhân viên</text>

  <!-- Connections from Quản lý -->
  <line x1="90" y1="205" x2="240" y2="140" stroke="#555" stroke-width="1.5"/>
  <line x1="90" y1="210" x2="240" y2="200" stroke="#555" stroke-width="1.5"/>
  <line x1="90" y1="215" x2="240" y2="260" stroke="#555" stroke-width="1.5"/>
  <line x1="90" y1="218" x2="515" y2="145" stroke="#555" stroke-width="1.5"/>
  <line x1="90" y1="220" x2="515" y2="210" stroke="#555" stroke-width="1.5"/>
  <line x1="90" y1="222" x2="515" y2="275" stroke="#555" stroke-width="1.5"/>
  <line x1="90" y1="230" x2="515" y2="345" stroke="#555" stroke-width="1.5"/>
  <line x1="90" y1="235" x2="310" y2="445" stroke="#555" stroke-width="1.5"/>

  <!-- Connections from Nhân viên -->
  <line x1="860" y1="393" x2="695" y2="345" stroke="#555" stroke-width="1.5"/>
  <line x1="860" y1="400" x2="530" y2="445" stroke="#555" stroke-width="1.5"/>
</svg>
