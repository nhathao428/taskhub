<svg xmlns="http://www.w3.org/2000/svg" width="500" height="620" viewBox="0 0 500 620" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect width="500" height="620" fill="white" rx="8"/>
  <text x="250" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Activity Diagram — Đăng nhập</text>

  <!-- Start node -->
  <circle cx="250" cy="65" r="18" fill="#2c3e50"/>
  <text x="250" y="100" text-anchor="middle" font-size="11" fill="#555">Bắt đầu</text>
  <line x1="250" y1="83" x2="250" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Action: Nhập thông tin -->
  <rect x="120" y="115" width="260" height="40" fill="#d6eaf8" stroke="#2980b9" stroke-width="2" rx="20"/>
  <text x="250" y="140" text-anchor="middle" font-size="12" fill="#1a252f" font-weight="bold">Nhập username + mật khẩu</text>
  <line x1="250" y1="155" x2="250" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision: username tồn tại? -->
  <polygon points="250,180 350,220 250,260 150,220" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="250" y="215" text-anchor="middle" font-size="11" fill="#7d3c00">Username</text>
  <text x="250" y="230" text-anchor="middle" font-size="11" fill="#7d3c00">tồn tại?</text>

  <!-- No branch -->
  <line x1="350" y1="220" x2="430" y2="220" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="390" y="212" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Không</text>

  <rect x="375" y="235" width="115" height="40" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="6"/>
  <text x="432" y="250" text-anchor="middle" font-size="10" fill="#c0392b">Hiển thị lỗi:</text>
  <text x="432" y="264" text-anchor="middle" font-size="10" fill="#c0392b">Sai thông tin</text>

  <line x1="432" y1="275" x2="432" y2="140" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="380" y1="140" x2="432" y2="140" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Yes branch down -->
  <line x1="250" y1="260" x2="250" y2="285" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="275" font-size="11" fill="#27ae60" font-weight="bold">Có</text>

  <!-- Decision: password khớp? -->
  <polygon points="250,285 350,325 250,365 150,325" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="250" y="318" text-anchor="middle" font-size="11" fill="#7d3c00">Password</text>
  <text x="250" y="333" text-anchor="middle" font-size="11" fill="#7d3c00">khớp BCrypt?</text>

  <!-- No branch password -->
  <line x1="150" y1="325" x2="70" y2="325" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="110" y="317" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Không</text>

  <rect x="15" y="308" width="55" height="35" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5" rx="6"/>
  <text x="42" y="321" text-anchor="middle" font-size="9" fill="#c0392b">Báo lỗi</text>
  <text x="42" y="333" text-anchor="middle" font-size="9" fill="#c0392b">mật khẩu</text>

  <line x1="42" y1="308" x2="42" y2="140" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="42" y1="140" x2="120" y2="140" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Yes branch password -->
  <line x1="250" y1="365" x2="250" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="381" font-size="11" fill="#27ae60" font-weight="bold">Có</text>

  <!-- Action: Tạo JWT -->
  <rect x="120" y="395" width="260" height="40" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="20"/>
  <text x="250" y="420" text-anchor="middle" font-size="12" fill="#1a5c2f" font-weight="bold">Tạo JWT Token (24 giờ)</text>
  <line x1="250" y1="435" x2="250" y2="460" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Action: Trả về token + role -->
  <rect x="120" y="465" width="260" height="40" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="20"/>
  <text x="250" y="485" text-anchor="middle" font-size="12" fill="#1a5c2f">Trả về token + role</text>
  <text x="250" y="499" text-anchor="middle" font-size="10" fill="#555">{token, username, role}</text>
  <line x1="250" y1="505" x2="250" y2="530" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Action: Chuyển Dashboard -->
  <rect x="120" y="535" width="260" height="40" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="20"/>
  <text x="250" y="555" text-anchor="middle" font-size="12" fill="#1a5c2f" font-weight="bold">Chuyển đến Dashboard</text>
  <line x1="250" y1="575" x2="250" y2="590" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- End node -->
  <circle cx="250" cy="600" r="12" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <circle cx="250" cy="600" r="7" fill="#2c3e50"/>
</svg>
