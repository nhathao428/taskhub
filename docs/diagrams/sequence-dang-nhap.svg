<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arr-dash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="640" fill="white"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Sequence Diagram — Đăng nhập Hệ thống</text>

  <!-- Alt/loop frames drawn FIRST (transparent) so lifelines show through -->
  <rect x="30" y="330" width="900" height="115" fill="none" stroke="#27ae60" stroke-width="1.5" rx="4" stroke-dasharray="6,3"/>
  <rect x="30" y="330" width="140" height="18" fill="#27ae60" rx="2"/>
  <text x="38" y="343" font-size="10" font-weight="bold" fill="white">alt [Xác thực thành công]</text>

  <rect x="30" y="455" width="900" height="90" fill="none" stroke="#e74c3c" stroke-width="1.5" rx="4" stroke-dasharray="6,3"/>
  <rect x="30" y="455" width="140" height="18" fill="#e74c3c" rx="2"/>
  <text x="38" y="468" font-size="10" font-weight="bold" fill="white">else [Xác thực thất bại]</text>

  <!-- Lifelines (drawn after frames so they appear on top of frame fills) -->
  <line x1="90" y1="105" x2="90" y2="620" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="248" y1="105" x2="248" y2="620" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="420" y1="105" x2="420" y2="620" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="590" y1="105" x2="590" y2="620" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="760" y1="105" x2="760" y2="620" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Participant boxes (white fill, colored stroke, dark text) -->
  <rect x="40" y="50" width="100" height="55" fill="white" stroke="#2980b9" stroke-width="2" rx="5"/>
  <text x="90" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Người dùng</text>
  <text x="90" y="89" text-anchor="middle" font-size="10" fill="#555">(Client)</text>

  <rect x="198" y="50" width="100" height="55" fill="white" stroke="#2980b9" stroke-width="2" rx="5"/>
  <text x="248" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Giao diện</text>
  <text x="248" y="89" text-anchor="middle" font-size="10" fill="#555">(React/Flutter)</text>

  <rect x="365" y="50" width="110" height="55" fill="white" stroke="#e67e22" stroke-width="2" rx="5"/>
  <text x="420" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">AuthController</text>
  <text x="420" y="89" text-anchor="middle" font-size="10" fill="#555">(Spring Boot)</text>

  <rect x="538" y="50" width="104" height="55" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="590" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">AuthManager</text>
  <text x="590" y="84" text-anchor="middle" font-size="10" fill="#555">+UserDetails</text>
  <text x="590" y="98" text-anchor="middle" font-size="9" fill="#555">Service</text>

  <rect x="710" y="50" width="100" height="55" fill="white" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="760" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Cơ sở dữ liệu</text>
  <text x="760" y="89" text-anchor="middle" font-size="10" fill="#555">(MySQL)</text>

  <!-- Step 1: Người dùng → Giao diện -->
  <line x1="90" y1="148" x2="240" y2="148" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="165" y="140" text-anchor="middle" font-size="11" fill="#333">Nhập username + password</text>

  <!-- Step 2: Giao diện → AuthController -->
  <line x1="248" y1="180" x2="412" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="172" text-anchor="middle" font-size="11" fill="#333">POST /api/auth/login</text>
  <text x="330" y="186" text-anchor="middle" font-size="10" fill="#555">{username, password}</text>

  <!-- Step 3: AuthController → AuthManager -->
  <line x1="420" y1="218" x2="582" y2="218" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="501" y="210" text-anchor="middle" font-size="11" fill="#333">authenticate(username, pw)</text>

  <!-- Step 4: AuthManager → DB -->
  <line x1="590" y1="252" x2="752" y2="252" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="671" y="244" text-anchor="middle" font-size="11" fill="#333">loadUserByUsername()</text>

  <!-- Step 5: DB → AuthManager (response) -->
  <line x1="752" y1="278" x2="598" y2="278" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="675" y="270" text-anchor="middle" font-size="10" fill="#555">Trả về UserDetails</text>

  <!-- BCrypt note -->
  <rect x="430" y="290" width="160" height="24" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="3"/>
  <text x="510" y="306" text-anchor="middle" font-size="10" fill="#7d6608">So sánh password BCrypt</text>

  <!-- alt SUCCESS branch -->
  <!-- Activation bar on AuthController -->
  <rect x="416" y="355" width="8" height="70" fill="white" stroke="#27ae60" stroke-width="1.5" rx="1"/>
  <text x="420" y="385" text-anchor="middle" font-size="10" fill="#333">Tạo JWT Token</text>

  <line x1="412" y1="398" x2="256" y2="415" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="334" y="405" text-anchor="middle" font-size="10" fill="#27ae60" font-weight="bold">200 OK + {token, role}</text>

  <line x1="248" y1="425" x2="98" y2="435" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="173" y="420" text-anchor="middle" font-size="10" fill="#27ae60">→ Chuyển đến Dashboard</text>

  <!-- else FAILURE branch -->
  <line x1="412" y1="495" x2="256" y2="495" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="334" y="487" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold">401 Unauthorized</text>

  <line x1="248" y1="515" x2="98" y2="520" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="173" y="508" text-anchor="middle" font-size="10" fill="#e74c3c">Hiển thị lỗi đăng nhập</text>

  <!-- Step numbers -->
  <circle cx="90" cy="148" r="9" fill="#2980b9"/>
  <text x="90" y="152" text-anchor="middle" font-size="8" fill="white" font-weight="bold">1</text>
  <circle cx="248" cy="180" r="9" fill="#2980b9"/>
  <text x="248" y="184" text-anchor="middle" font-size="8" fill="white" font-weight="bold">2</text>
  <circle cx="420" cy="218" r="9" fill="#e67e22"/>
  <text x="420" y="222" text-anchor="middle" font-size="8" fill="white" font-weight="bold">3</text>
  <circle cx="590" cy="252" r="9" fill="#27ae60"/>
  <text x="590" y="256" text-anchor="middle" font-size="8" fill="white" font-weight="bold">4</text>
</svg>
