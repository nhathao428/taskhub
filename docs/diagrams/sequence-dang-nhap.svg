<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#f8f9fa" rx="8"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2c3e50">Sequence Diagram — Đăng nhập Hệ thống</text>

  <!-- Lifeline headers -->
  <rect x="30" y="50" width="110" height="50" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
  <text x="85" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Người dùng</text>
  <text x="85" y="88" text-anchor="middle" font-size="10" fill="#aed6f1">(Client)</text>

  <rect x="190" y="50" width="110" height="50" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
  <text x="245" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Giao diện</text>
  <text x="245" y="88" text-anchor="middle" font-size="10" fill="#aed6f1">(React/Flutter)</text>

  <rect x="360" y="50" width="120" height="50" fill="#e67e22" stroke="#ca6f1e" stroke-width="2" rx="5"/>
  <text x="420" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">AuthController</text>
  <text x="420" y="88" text-anchor="middle" font-size="10" fill="#fdebd0">(Spring Boot)</text>

  <rect x="530" y="50" width="110" height="50" fill="#27ae60" stroke="#1e8449" stroke-width="2" rx="5"/>
  <text x="585" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="white">AuthManager</text>
  <text x="585" y="82" text-anchor="middle" font-size="10" fill="#a9dfbf">+</text>
  <text x="585" y="94" text-anchor="middle" font-size="10" fill="#a9dfbf">UserDetails</text>

  <rect x="690" y="50" width="110" height="50" fill="#8e44ad" stroke="#7d3c98" stroke-width="2" rx="5"/>
  <text x="745" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Cơ sở dữ liệu</text>
  <text x="745" y="88" text-anchor="middle" font-size="10" fill="#d2b4de">(MySQL)</text>

  <!-- Lifelines -->
  <line x1="85" y1="100" x2="85" y2="600" stroke="#3498db" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="245" y1="100" x2="245" y2="600" stroke="#3498db" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="420" y1="100" x2="420" y2="600" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="585" y1="100" x2="585" y2="600" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="745" y1="100" x2="745" y2="600" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Step 1: Người dùng → Giao diện -->
  <line x1="85" y1="140" x2="235" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="165" y="132" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">Nhập username + password</text>

  <!-- Step 2: Giao diện → AuthController -->
  <line x1="245" y1="175" x2="410" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="327" y="167" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">POST /api/auth/login</text>
  <text x="327" y="182" text-anchor="middle" font-size="10" fill="#555">{username, password}</text>

  <!-- Note: JWT check -->
  <rect x="425" y="155" width="105" height="30" fill="#eaf4fb" stroke="#aed6f1" stroke-width="1" rx="3"/>
  <text x="477" y="172" text-anchor="middle" font-size="9" fill="#1a5276">Xác thực JWT header</text>

  <!-- Step 3: AuthController → AuthManager -->
  <line x1="420" y1="215" x2="575" y2="215" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="497" y="207" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">authenticate(username, pw)</text>

  <!-- Step 4: AuthManager → DB -->
  <line x1="585" y1="250" x2="735" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="660" y="242" text-anchor="middle" font-size="11" fill="#1a252f">loadUserByUsername()</text>

  <!-- Step 5: DB → AuthManager -->
  <line x1="735" y1="280" x2="595" y2="280" stroke="#888" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-dash)"/>
  <text x="665" y="272" text-anchor="middle" font-size="10" fill="#555">Trả về UserDetails</text>

  <!-- Note: BCrypt comparison -->
  <rect x="425" y="290" width="155" height="28" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="3"/>
  <text x="502" y="308" text-anchor="middle" font-size="10" fill="#7d6608">So sánh password BCrypt</text>

  <!-- Alt: Success branch -->
  <rect x="30" y="330" width="840" height="115" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5" rx="5" stroke-dasharray="5,3"/>
  <text x="48" y="350" font-size="11" font-weight="bold" fill="#1e8449">alt [Xác thực thành công]</text>

  <line x1="420" y1="365" x2="420" y2="365"/>
  <!-- JwtUtil creates token -->
  <rect x="380" y="355" width="80" height="22" fill="#27ae60" stroke="#1e8449" stroke-width="1" rx="3"/>
  <text x="420" y="370" text-anchor="middle" font-size="10" fill="white">Tạo JWT Token</text>

  <line x1="420" y1="385" x2="250" y2="400" stroke="#888" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-dash)"/>
  <text x="335" y="393" text-anchor="middle" font-size="10" fill="#1e8449" font-weight="bold">200 OK + {token, role}</text>

  <line x1="245" y1="415" x2="95" y2="430" stroke="#888" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-dash)"/>
  <text x="170" y="422" text-anchor="middle" font-size="10" fill="#1e8449">→ Chuyển đến Dashboard</text>

  <!-- Alt: Failure branch -->
  <rect x="30" y="455" width="840" height="90" fill="#fef0f0" stroke="#e74c3c" stroke-width="1.5" rx="5" stroke-dasharray="5,3"/>
  <text x="48" y="474" font-size="11" font-weight="bold" fill="#c0392b">else [Xác thực thất bại]</text>

  <line x1="420" y1="490" x2="250" y2="490" stroke="#888" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-dash)"/>
  <text x="335" y="483" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">401 Unauthorized</text>

  <line x1="245" y1="510" x2="95" y2="520" stroke="#888" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-dash)"/>
  <text x="170" y="508" text-anchor="middle" font-size="10" fill="#c0392b">Hiển thị lỗi đăng nhập</text>

  <!-- Step numbers -->
  <circle cx="95" cy="140" r="10" fill="#3498db"/>
  <text x="95" y="144" text-anchor="middle" font-size="9" fill="white" font-weight="bold">1</text>
  <circle cx="255" cy="175" r="10" fill="#3498db"/>
  <text x="255" y="179" text-anchor="middle" font-size="9" fill="white" font-weight="bold">2</text>
  <circle cx="430" cy="215" r="10" fill="#e67e22"/>
  <text x="430" y="219" text-anchor="middle" font-size="9" fill="white" font-weight="bold">3</text>
  <circle cx="595" cy="250" r="10" fill="#27ae60"/>
  <text x="595" y="254" text-anchor="middle" font-size="9" fill="white" font-weight="bold">4</text>
</svg>
