<svg xmlns="http://www.w3.org/2000/svg" width="700" height="600" viewBox="0 0 700 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect width="700" height="600" fill="white" rx="8"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Activity Diagram — Quản lý Dự án</text>

  <!-- Start -->
  <circle cx="350" cy="60" r="16" fill="#2c3e50"/>
  <line x1="350" y1="76" x2="350" y2="96" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision: Chọn thao tác -->
  <polygon points="350,96 460,138 350,180 240,138" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="350" y="131" text-anchor="middle" font-size="12" fill="#7d3c00">Chọn</text>
  <text x="350" y="148" text-anchor="middle" font-size="12" fill="#7d3c00">thao tác?</text>

  <!-- Branch: XEM -->
  <line x1="240" y1="138" x2="90" y2="138" stroke="#2980b9" stroke-width="2" marker-end="url(#arr)"/>
  <text x="165" y="130" text-anchor="middle" font-size="11" fill="#2980b9" font-weight="bold">Xem</text>
  <rect x="15" y="158" width="150" height="40" fill="#d6eaf8" stroke="#2980b9" stroke-width="2" rx="8"/>
  <text x="90" y="174" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">GET /api/projects</text>
  <text x="90" y="188" text-anchor="middle" font-size="10" fill="#555">Lấy danh sách dự án</text>
  <line x1="90" y1="198" x2="90" y2="530" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="90" y1="530" x2="200" y2="530" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Branch: TẠO MỚI -->
  <line x1="350" y1="180" x2="350" y2="205" stroke="#27ae60" stroke-width="2" marker-end="url(#arr)"/>
  <text x="362" y="198" font-size="11" fill="#27ae60" font-weight="bold">Tạo mới</text>
  <rect x="235" y="210" width="230" height="40" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="350" y="226" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">Nhập thông tin dự án</text>
  <text x="350" y="240" text-anchor="middle" font-size="10" fill="#555">{name, description, startDate, endDate}</text>
  <line x1="350" y1="250" x2="350" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="235" y="275" width="230" height="40" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="350" y="291" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">POST /api/projects</text>
  <text x="350" y="305" text-anchor="middle" font-size="10" fill="#555">Tạo dự án, status = ongoing</text>
  <line x1="350" y1="315" x2="350" y2="530" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="350" y1="530" x2="350" y2="530" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Branch: CẬP NHẬT -->
  <line x1="460" y1="138" x2="560" y2="160" stroke="#e67e22" stroke-width="2" marker-end="url(#arr)"/>
  <text x="520" y="148" text-anchor="middle" font-size="11" fill="#e67e22" font-weight="bold">Cập nhật</text>
  <rect x="540" y="165" width="145" height="40" fill="#fdebd0" stroke="#e67e22" stroke-width="2" rx="8"/>
  <text x="612" y="181" text-anchor="middle" font-size="11" fill="#7d3c00" font-weight="bold">Chọn dự án</text>
  <text x="612" y="195" text-anchor="middle" font-size="10" fill="#7d3c00">cần sửa</text>
  <line x1="612" y1="205" x2="612" y2="228" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="540" y="232" width="145" height="40" fill="#fdebd0" stroke="#e67e22" stroke-width="2" rx="8"/>
  <text x="612" y="248" text-anchor="middle" font-size="11" fill="#7d3c00" font-weight="bold">PUT /api/projects/{id}</text>
  <text x="612" y="262" text-anchor="middle" font-size="10" fill="#7d3c00">Cập nhật thông tin</text>
  <line x1="612" y1="272" x2="612" y2="530" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="612" y1="530" x2="500" y2="530" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Branch: XÓA -->
  <line x1="460" y1="138" x2="560" y2="380" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="560" y1="380" x2="560" y2="395" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="530" y="290" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Xóa</text>
  <rect x="540" y="400" width="145" height="40" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="8"/>
  <text x="612" y="416" text-anchor="middle" font-size="11" fill="#7d3c00" font-weight="bold">DELETE</text>
  <text x="612" y="430" text-anchor="middle" font-size="10" fill="#c0392b">/api/projects/{id}</text>
  <line x1="612" y1="440" x2="612" y2="530" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Result -->
  <rect x="200" y="525" width="300" height="40" fill="#aed6f1" stroke="#2980b9" stroke-width="2" rx="8"/>
  <text x="350" y="541" text-anchor="middle" font-size="12" fill="#1a252f" font-weight="bold">Hiển thị danh sách dự án</text>
  <text x="350" y="555" text-anchor="middle" font-size="10" fill="#555">(cập nhật giao diện)</text>
  <line x1="350" y1="565" x2="350" y2="582" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- End -->
  <circle cx="350" cy="592" r="9" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <circle cx="350" cy="592" r="5" fill="#2c3e50"/>
</svg>
