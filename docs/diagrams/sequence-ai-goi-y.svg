<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" font-family="Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .lifeline-box { fill: #cce5ff; stroke: #1a1a1a; stroke-width: 1.5; }
    .lifeline-text { font-size: 12px; font-weight: bold; fill: #1a1a1a; text-anchor: middle; }
    .msg-text { font-size: 11px; fill: #1a1a1a; }
    .return-text { font-size: 11px; fill: #555; font-style: italic; }
    .activation { fill: #fff; stroke: #1a1a1a; stroke-width: 1; }
    .note-text { font-size: 11px; fill: #1a1a1a; }
  </style>

  <text x="550" y="32" text-anchor="middle" class="title">Sequence — AI Gợi ý Nhân viên</text>

  <!-- Lifeline boxes -->
  <rect x="40" y="60" width="120" height="40" class="lifeline-box" rx="3"/>
  <text x="100" y="84" class="lifeline-text">Manager</text>

  <rect x="200" y="60" width="150" height="40" class="lifeline-box" rx="3"/>
  <text x="275" y="78" class="lifeline-text">SuggestionController</text>
  <text x="275" y="94" font-size="10" fill="#555" text-anchor="middle">«controller»</text>

  <rect x="390" y="60" width="160" height="40" class="lifeline-box" rx="3"/>
  <text x="470" y="78" class="lifeline-text">AiSuggestionService</text>
  <text x="470" y="94" font-size="10" fill="#555" text-anchor="middle">«service»</text>

  <rect x="590" y="60" width="130" height="40" class="lifeline-box" rx="3"/>
  <text x="655" y="78" class="lifeline-text">TaskRepository</text>
  <text x="655" y="94" font-size="10" fill="#555" text-anchor="middle">«repository»</text>

  <rect x="760" y="60" width="160" height="40" class="lifeline-box" rx="3"/>
  <text x="840" y="78" class="lifeline-text">AttendanceRepository</text>
  <text x="840" y="94" font-size="10" fill="#555" text-anchor="middle">«repository»</text>

  <rect x="960" y="60" width="120" height="40" class="lifeline-box" rx="3"/>
  <text x="1020" y="84" class="lifeline-text">OpenAI GPT</text>

  <!-- Lifelines -->
  <line x1="100" y1="100" x2="100" y2="740" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="275" y1="100" x2="275" y2="740" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="470" y1="100" x2="470" y2="740" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="655" y1="100" x2="655" y2="740" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="840" y1="100" x2="840" y2="740" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1020" y1="100" x2="1020" y2="740" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 1. POST -->
  <line x1="100" y1="135" x2="270" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="270,135 262,131 262,139" fill="#1a1a1a"/>
  <text x="105" y="128" class="msg-text">1: POST /api/suggestions/recommend</text>
  <text x="105" y="148" class="msg-text" font-style="italic">{taskTitle, taskDescription}</text>
  <rect x="271" y="135" width="8" height="540" class="activation"/>

  <!-- 2. recommendEmployees -->
  <line x1="279" y1="180" x2="465" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="465,180 457,176 457,184" fill="#1a1a1a"/>
  <text x="285" y="173" class="msg-text">2: recommendEmployees(request)</text>
  <rect x="466" y="180" width="8" height="490" class="activation"/>

  <!-- 3. requireApiKey self-loop -->
  <line x1="475" y1="215" x2="495" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="495" y1="215" x2="495" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="495" y1="240" x2="475" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="475,240 483,236 483,244" fill="#1a1a1a"/>
  <text x="500" y="230" class="msg-text">3: requireApiKey()</text>
  <text x="500" y="244" class="return-text">throws BusinessException nếu thiếu</text>

  <text x="105" y="280" class="note-text" font-style="italic" fill="#888">Bỏ qua: gọi EmployeeRepository.findAll() để lấy danh sách nhân viên</text>

  <!-- 5. Batch query Tasks -->
  <line x1="474" y1="320" x2="650" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="650,320 642,316 642,324" fill="#1a1a1a"/>
  <text x="478" y="313" class="msg-text">5: findByAssignedToEmployeeIdIn(ids)</text>
  <rect x="651" y="320" width="8" height="40" class="activation"/>

  <line x1="650" y1="355" x2="479" y2="355" stroke="#555" stroke-width="1" stroke-dasharray="5,3"/>
  <polygon points="479,355 487,351 487,359" fill="#555"/>
  <text x="485" y="350" class="return-text">List&lt;Task&gt; (tổng / hoàn thành / đúng hạn)</text>

  <!-- 6. Batch query Attendance -->
  <line x1="474" y1="395" x2="835" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="835,395 827,391 827,399" fill="#1a1a1a"/>
  <text x="478" y="388" class="msg-text">6: findByEmployeeIdInAndDateBetween(ids, last30days)</text>
  <rect x="836" y="395" width="8" height="40" class="activation"/>

  <line x1="835" y1="430" x2="479" y2="430" stroke="#555" stroke-width="1" stroke-dasharray="5,3"/>
  <polygon points="479,430 487,426 487,434" fill="#555"/>
  <text x="485" y="425" class="return-text">List&lt;Attendance&gt; (số ngày làm việc)</text>

  <!-- 7. collectStats -->
  <line x1="475" y1="465" x2="495" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="495" y1="465" x2="495" y2="490" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="495" y1="490" x2="475" y2="490" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="475,490 483,486 483,494" fill="#1a1a1a"/>
  <text x="500" y="478" class="msg-text">7: collectStats() — tổng hợp 3 nhóm dữ liệu thô</text>

  <!-- 8. buildPrompt -->
  <line x1="475" y1="510" x2="495" y2="510" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="495" y1="510" x2="495" y2="530" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="495" y1="530" x2="475" y2="530" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="475,530 483,526 483,534" fill="#1a1a1a"/>
  <text x="500" y="525" class="msg-text">8: buildPrompt() — tiếng Việt + 3 tiêu chí ưu tiên</text>

  <!-- 9. OpenAI call -->
  <line x1="474" y1="565" x2="1015" y2="565" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="1015,565 1007,561 1007,569" fill="#1a1a1a"/>
  <text x="478" y="558" class="msg-text">9: POST /v1/chat/completions {model: gpt-4o-mini, messages}</text>
  <rect x="1016" y="565" width="8" height="40" class="activation"/>

  <line x1="1015" y1="600" x2="479" y2="600" stroke="#555" stroke-width="1" stroke-dasharray="5,3"/>
  <polygon points="479,600 487,596 487,604" fill="#555"/>
  <text x="485" y="595" class="return-text">JSON: [{employeeId, rank, reasoning}, ...]</text>

  <!-- 10. parse -->
  <line x1="475" y1="635" x2="495" y2="635" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="495" y1="635" x2="495" y2="655" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="495" y1="655" x2="475" y2="655" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="475,655 483,651 483,659" fill="#1a1a1a"/>
  <text x="500" y="650" class="msg-text">10: parseOpenAiResponse() → List&lt;EmployeeSuggestionDTO&gt;</text>

  <!-- Return to controller -->
  <line x1="465" y1="685" x2="280" y2="685" stroke="#555" stroke-width="1" stroke-dasharray="5,3"/>
  <polygon points="280,685 288,681 288,689" fill="#555"/>
  <text x="295" y="680" class="return-text">List&lt;EmployeeSuggestionDTO&gt; (top 5)</text>

  <!-- Return to client -->
  <line x1="270" y1="720" x2="105" y2="720" stroke="#555" stroke-width="1" stroke-dasharray="5,3"/>
  <polygon points="105,720 113,716 113,724" fill="#555"/>
  <text x="115" y="715" class="return-text">200 OK + ApiResponse&lt;List&lt;EmployeeSuggestionDTO&gt;&gt;</text>
</svg>
