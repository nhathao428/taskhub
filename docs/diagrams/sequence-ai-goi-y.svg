<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arr-dash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="740" fill="white"/>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Sequence Diagram — AI Gợi ý Nhân viên</text>

  <!-- Participant x-positions: 60, 175, 295, 400, 500, 600, 700, 820 -->

  <!-- Alt frames drawn FIRST -->
  <!-- OpenAI branch -->
  <rect x="140" y="400" width="740" height="140" fill="none" stroke="#8e44ad" stroke-width="1.5" rx="4" stroke-dasharray="6,3"/>
  <rect x="140" y="400" width="200" height="18" fill="#8e44ad" rx="2"/>
  <text x="150" y="413" font-size="10" font-weight="bold" fill="white">alt [OpenAI API Key cấu hình]</text>

  <!-- Fallback branch -->
  <rect x="140" y="550" width="740" height="100" fill="none" stroke="#e67e22" stroke-width="1.5" rx="4" stroke-dasharray="6,3"/>
  <rect x="140" y="550" width="230" height="18" fill="#e67e22" rx="2"/>
  <text x="150" y="563" font-size="10" font-weight="bold" fill="white">else [Fallback — Rule-based không cần API]</text>

  <!-- Batch query note box -->
  <rect x="215" y="215" width="260" height="22" fill="#eafaf1" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="345" y="230" text-anchor="middle" font-size="9" fill="#1a5c2f" font-weight="bold">Batch Query — 4 câu truy vấn song song</text>

  <!-- Lifelines -->
  <line x1="60" y1="115" x2="60" y2="720" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="175" y1="115" x2="175" y2="720" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="295" y1="115" x2="295" y2="720" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="400" y1="115" x2="400" y2="720" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="500" y1="115" x2="500" y2="720" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="600" y1="115" x2="600" y2="720" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="700" y1="115" x2="700" y2="720" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="820" y1="115" x2="820" y2="720" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Participant boxes -->
  <rect x="15" y="52" width="90" height="58" fill="white" stroke="#e67e22" stroke-width="2" rx="5"/>
  <text x="60" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Quản lý</text>
  <text x="60" y="92" text-anchor="middle" font-size="9" fill="#555">(Actor)</text>

  <rect x="128" y="52" width="95" height="58" fill="white" stroke="#e67e22" stroke-width="2" rx="5"/>
  <text x="175" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Suggestion</text>
  <text x="175" y="85" text-anchor="middle" font-size="10" fill="#333">Controller</text>
  <text x="175" y="100" text-anchor="middle" font-size="9" fill="#555">(REST API)</text>

  <rect x="248" y="52" width="95" height="58" fill="white" stroke="#1abc9c" stroke-width="2" rx="5"/>
  <text x="295" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">AiSuggestion</text>
  <text x="295" y="85" text-anchor="middle" font-size="10" fill="#333">Service</text>
  <text x="295" y="100" text-anchor="middle" font-size="9" fill="#555">(Core Logic)</text>

  <rect x="358" y="52" width="85" height="58" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="400" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Employee</text>
  <text x="400" y="86" text-anchor="middle" font-size="10" fill="#333">Repository</text>

  <rect x="458" y="52" width="85" height="58" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="500" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Skill</text>
  <text x="500" y="86" text-anchor="middle" font-size="10" fill="#333">Repository</text>

  <rect x="558" y="52" width="85" height="58" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="600" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Task</text>
  <text x="600" y="86" text-anchor="middle" font-size="10" fill="#333">Repository</text>

  <rect x="658" y="52" width="85" height="58" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="700" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Attendance</text>
  <text x="700" y="86" text-anchor="middle" font-size="10" fill="#333">Repository</text>

  <rect x="775" y="52" width="90" height="58" fill="white" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="820" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">OpenAI</text>
  <text x="820" y="92" text-anchor="middle" font-size="10" fill="#555">API</text>

  <!-- Step 1: Quản lý → Controller -->
  <line x1="60" y1="148" x2="167" y2="148" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="113" y="140" text-anchor="middle" font-size="10" fill="#333">POST /api/suggestions/recommend</text>

  <!-- JWT note -->
  <rect x="130" y="155" width="90" height="20" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="2"/>
  <text x="175" y="168" text-anchor="middle" font-size="8" fill="#7d6608">Xác thực JWT (ADMIN)</text>

  <!-- Step 2: Controller → AI Service -->
  <line x1="175" y1="190" x2="287" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="231" y="182" text-anchor="middle" font-size="10" fill="#333">recommendEmployees(request)</text>

  <!-- Batch queries -->
  <line x1="295" y1="248" x2="392" y2="248" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="343" y="240" text-anchor="middle" font-size="10" fill="#333">findAll() — tất cả nhân viên</text>
  <line x1="392" y1="262" x2="303" y2="262" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-dash)"/>
  <text x="347" y="256" text-anchor="middle" font-size="9" fill="#555">List&lt;Employee&gt;</text>

  <line x1="295" y1="282" x2="492" y2="282" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="393" y="274" text-anchor="middle" font-size="10" fill="#333">findByEmployeeEmployeeIdIn(ids)</text>
  <line x1="492" y1="296" x2="303" y2="296" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-dash)"/>
  <text x="397" y="290" text-anchor="middle" font-size="9" fill="#555">List&lt;Skill&gt;</text>

  <line x1="295" y1="316" x2="592" y2="316" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="443" y="308" text-anchor="middle" font-size="10" fill="#333">findByAssignedToIdInAndStatusIn()</text>
  <line x1="592" y1="330" x2="303" y2="330" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-dash)"/>
  <text x="447" y="324" text-anchor="middle" font-size="9" fill="#555">List&lt;Task&gt;</text>

  <line x1="295" y1="350" x2="692" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="493" y="342" text-anchor="middle" font-size="10" fill="#333">findByEmployeeIdInAndDateBetween(ids, 30 ngày)</text>
  <line x1="692" y1="364" x2="303" y2="364" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-dash)"/>
  <text x="497" y="358" text-anchor="middle" font-size="9" fill="#555">List&lt;Attendance&gt;</text>

  <!-- alt: OpenAI branch -->
  <!-- buildPrompt activation -->
  <rect x="291" y="422" width="8" height="20" fill="white" stroke="#1abc9c" stroke-width="1.5" rx="1"/>
  <text x="295" y="432" text-anchor="middle" font-size="10" fill="#333">buildPrompt()</text>

  <line x1="295" y1="448" x2="812" y2="448" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="554" y="440" text-anchor="middle" font-size="10" fill="#8e44ad" font-weight="bold">POST /v1/chat/completions (GPT)</text>

  <line x1="812" y1="468" x2="303" y2="490" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="557" y="475" text-anchor="middle" font-size="10" fill="#8e44ad">JSON → parseOpenAiResponse()</text>

  <!-- else: Fallback -->
  <rect x="150" y="570" width="720" height="62" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="3"/>
  <text x="510" y="590" text-anchor="middle" font-size="10" fill="#7d6608" font-weight="bold">calculateFallbackScores(employees, skills, tasks, attendance)</text>
  <text x="510" y="608" text-anchor="middle" font-size="10" fill="#7d6608">Tính điểm: Kỹ năng×35% + Khối lượng×25% + Hiệu suất×25% + CC×15%</text>
  <text x="510" y="622" text-anchor="middle" font-size="9" fill="#555">→ Sắp xếp giảm dần theo overallScore → top 5</text>

  <!-- Final response -->
  <line x1="295" y1="665" x2="183" y2="665" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="239" y="657" text-anchor="middle" font-size="10" fill="#1abc9c" font-weight="bold">Top 5 EmployeeSuggestionDTO</text>

  <line x1="175" y1="683" x2="68" y2="683" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="121" y="676" text-anchor="middle" font-size="10" fill="#e67e22" font-weight="bold">200 OK — Gợi ý + lý do</text>
</svg>
