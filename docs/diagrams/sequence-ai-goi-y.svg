<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="720" viewBox="0 0 1050 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arr-dash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>
  <rect width="1050" height="720" fill="#f8f9fa" rx="8"/>
  <text x="525" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2c3e50">Sequence Diagram — AI Gợi ý Nhân viên</text>

  <!-- Lifeline headers -->
  <rect x="15" y="50" width="90" height="55" fill="#e67e22" stroke="#ca6f1e" stroke-width="2" rx="5"/>
  <text x="60" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Quản lý</text>
  <text x="60" y="87" text-anchor="middle" font-size="9" fill="#fdebd0">(Actor)</text>

  <rect x="120" y="50" width="100" height="55" fill="#e67e22" stroke="#ca6f1e" stroke-width="2" rx="5"/>
  <text x="170" y="68" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Suggestion</text>
  <text x="170" y="82" text-anchor="middle" font-size="10" fill="white">Controller</text>
  <text x="170" y="97" text-anchor="middle" font-size="9" fill="#fdebd0">(REST API)</text>

  <rect x="235" y="50" width="100" height="55" fill="#1abc9c" stroke="#148f77" stroke-width="2" rx="5"/>
  <text x="285" y="68" text-anchor="middle" font-size="10" font-weight="bold" fill="white">AiSuggestion</text>
  <text x="285" y="82" text-anchor="middle" font-size="10" fill="white">Service</text>
  <text x="285" y="97" text-anchor="middle" font-size="9" fill="#a2d9ce">(Core Logic)</text>

  <rect x="350" y="50" width="90" height="55" fill="#27ae60" stroke="#1e8449" stroke-width="2" rx="5"/>
  <text x="395" y="68" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Employee</text>
  <text x="395" y="82" text-anchor="middle" font-size="10" fill="white">Repository</text>

  <rect x="455" y="50" width="80" height="55" fill="#27ae60" stroke="#1e8449" stroke-width="2" rx="5"/>
  <text x="495" y="68" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Skill</text>
  <text x="495" y="82" text-anchor="middle" font-size="10" fill="white">Repository</text>

  <rect x="550" y="50" width="80" height="55" fill="#27ae60" stroke="#1e8449" stroke-width="2" rx="5"/>
  <text x="590" y="68" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Task</text>
  <text x="590" y="82" text-anchor="middle" font-size="10" fill="white">Repository</text>

  <rect x="645" y="50" width="80" height="55" fill="#27ae60" stroke="#1e8449" stroke-width="2" rx="5"/>
  <text x="685" y="68" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Attendance</text>
  <text x="685" y="82" text-anchor="middle" font-size="10" fill="white">Repository</text>

  <rect x="745" y="50" width="90" height="55" fill="#8e44ad" stroke="#7d3c98" stroke-width="2" rx="5"/>
  <text x="790" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="white">OpenAI</text>
  <text x="790" y="87" text-anchor="middle" font-size="10" fill="#d2b4de">API</text>

  <!-- Lifelines -->
  <line x1="60" y1="105" x2="60" y2="700" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="170" y1="105" x2="170" y2="700" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="285" y1="105" x2="285" y2="700" stroke="#1abc9c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="395" y1="105" x2="395" y2="700" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="495" y1="105" x2="495" y2="700" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="590" y1="105" x2="590" y2="700" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="685" y1="105" x2="685" y2="700" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="790" y1="105" x2="790" y2="700" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Step 1: Quản lý → Controller -->
  <line x1="60" y1="138" x2="160" y2="138" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="110" y="130" text-anchor="middle" font-size="10" fill="#1a252f" font-weight="bold">POST /api/suggestions/recommend</text>
  <text x="110" y="145" text-anchor="middle" font-size="9" fill="#555">{taskTitle, description, requiredSkills}</text>

  <!-- Note JWT -->
  <rect x="125" y="152" width="90" height="20" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="2"/>
  <text x="170" y="165" text-anchor="middle" font-size="8" fill="#7d6608">Xác thực JWT (ADMIN)</text>

  <!-- Step 2: Controller → AI Service -->
  <line x1="170" y1="185" x2="275" y2="185" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="222" y="177" text-anchor="middle" font-size="10" fill="#1a252f">recommendEmployees(request)</text>

  <!-- Batch queries note -->
  <rect x="200" y="195" width="240" height="22" fill="#eafaf1" stroke="#1e8449" stroke-width="1" rx="3"/>
  <text x="320" y="210" text-anchor="middle" font-size="9" fill="#1a5c2f" font-weight="bold">Batch Query — 4 câu truy vấn song song</text>

  <!-- Step 3a: findAll employees -->
  <line x1="285" y1="230" x2="385" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="335" y="222" text-anchor="middle" font-size="10" fill="#1a252f">findAll() — tất cả nhân viên</text>
  <line x1="385" y1="248" x2="295" y2="248" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="340" y="241" text-anchor="middle" font-size="9" fill="#555">List&lt;Employee&gt;</text>

  <!-- Step 3b: findByEmployeeIn -->
  <line x1="285" y1="268" x2="485" y2="268" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="385" y="261" text-anchor="middle" font-size="10" fill="#1a252f">findByEmployeeEmployeeIdIn(ids)</text>
  <line x1="485" y1="286" x2="295" y2="286" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="390" y="279" text-anchor="middle" font-size="9" fill="#555">List&lt;Skill&gt; → groupingBy employeeId</text>

  <!-- Step 3c: findByAssignedTo -->
  <line x1="285" y1="305" x2="580" y2="305" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="432" y="298" text-anchor="middle" font-size="10" fill="#1a252f">findByAssignedToIdInAndStatusIn(ids, statuses)</text>
  <line x1="580" y1="323" x2="295" y2="323" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="437" y="316" text-anchor="middle" font-size="9" fill="#555">List&lt;Task&gt; → groupingBy employeeId</text>

  <!-- Step 3d: findAttendance -->
  <line x1="285" y1="342" x2="675" y2="342" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="480" y="335" text-anchor="middle" font-size="10" fill="#1a252f">findByEmployeeIdInAndDateBetween(ids, 30 ngày)</text>
  <line x1="675" y1="360" x2="295" y2="360" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="485" y="353" text-anchor="middle" font-size="9" fill="#555">List&lt;Attendance&gt; → groupingBy employeeId</text>

  <!-- Alt branches -->
  <rect x="200" y="375" width="630" height="270" fill="white" stroke="#aaa" stroke-width="1.5" rx="5"/>

  <!-- Branch 1: OpenAI -->
  <rect x="200" y="375" width="630" height="135" fill="#f0f0ff" stroke="#8e44ad" stroke-width="1" rx="5"/>
  <text x="215" y="393" font-size="11" font-weight="bold" fill="#7d3c98">alt [OpenAI API Key được cấu hình]</text>

  <line x1="285" y1="408" x2="285" y2="408"/>
  <rect x="240" y="400" width="90" height="22" fill="#1abc9c" stroke="#148f77" stroke-width="1" rx="3"/>
  <text x="285" y="415" text-anchor="middle" font-size="10" fill="white">buildPrompt(...)</text>

  <line x1="285" y1="435" x2="780" y2="435" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="532" y="427" text-anchor="middle" font-size="10" fill="#8e44ad" font-weight="bold">POST /v1/chat/completions (GPT-4)</text>
  <text x="532" y="441" text-anchor="middle" font-size="9" fill="#555">Gửi prompt với dữ liệu nhân viên</text>

  <line x1="780" y1="460" x2="295" y2="480" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="537" y="463" text-anchor="middle" font-size="10" fill="#8e44ad">Trả về JSON → parseOpenAiResponse()</text>

  <!-- Branch 2: Fallback -->
  <rect x="200" y="510" width="630" height="135" fill="#fff8e1" stroke="#f39c12" stroke-width="1" rx="5"/>
  <text x="215" y="528" font-size="11" font-weight="bold" fill="#ca6f1e">else [Không có API Key — Fallback Rule-based]</text>

  <rect x="210" y="535" width="610" height="60" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="3"/>
  <text x="515" y="552" text-anchor="middle" font-size="10" fill="#7d6608" font-weight="bold">calculateFallbackScores(employees, skills, tasks, attendance)</text>
  <text x="515" y="568" text-anchor="middle" font-size="10" fill="#7d6608">Tính điểm: Kỹ năng×35% + Khối lượng×25% + Hiệu suất×25% + CC×15%</text>
  <text x="515" y="584" text-anchor="middle" font-size="10" fill="#7d6608">→ Sắp xếp giảm dần theo overallScore</text>

  <!-- Final return -->
  <line x1="285" y1="656" x2="180" y2="656" stroke="#888" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="232" y="648" text-anchor="middle" font-size="10" fill="#1abc9c" font-weight="bold">Top 5 EmployeeSuggestionDTO</text>

  <line x1="170" y1="673" x2="70" y2="673" stroke="#888" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="120" y="666" text-anchor="middle" font-size="10" fill="#e67e22" font-weight="bold">200 OK — Danh sách gợi ý + lý do</text>
</svg>
