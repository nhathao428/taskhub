<svg xmlns="http://www.w3.org/2000/svg" width="500" height="680" viewBox="0 0 500 680" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect width="500" height="680" fill="#f8f9fa" rx="8"/>
  <text x="250" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Activity Diagram — Đăng ký Tài khoản</text>

  <!-- Start -->
  <circle cx="250" cy="62" r="18" fill="#2c3e50"/>
  <line x1="250" y1="80" x2="250" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Action: Nhập thông tin -->
  <rect x="105" y="105" width="290" height="42" fill="#d6eaf8" stroke="#2980b9" stroke-width="2" rx="20"/>
  <text x="250" y="121" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">Nhập username, email, mật khẩu</text>
  <text x="250" y="136" text-anchor="middle" font-size="10" fill="#555">+ Nhấn nút Đăng ký</text>
  <line x1="250" y1="147" x2="250" y2="168" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision: username trùng? -->
  <polygon points="250,168 355,210 250,252 145,210" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="250" y="204" text-anchor="middle" font-size="11" fill="#7d3c00">Username đã</text>
  <text x="250" y="220" text-anchor="middle" font-size="11" fill="#7d3c00">tồn tại?</text>

  <!-- Yes → Lỗi -->
  <line x1="355" y1="210" x2="430" y2="210" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="393" y="203" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Có</text>
  <rect x="380" y="225" width="110" height="38" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5" rx="6"/>
  <text x="435" y="238" text-anchor="middle" font-size="10" fill="#c0392b">Báo lỗi:</text>
  <text x="435" y="251" text-anchor="middle" font-size="10" fill="#c0392b">Username đã tồn tại</text>
  <line x1="435" y1="263" x2="435" y2="126" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="395" y1="126" x2="435" y2="126" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- No → -->
  <line x1="250" y1="252" x2="250" y2="275" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="266" font-size="11" fill="#27ae60" font-weight="bold">Không</text>

  <!-- Decision: email trùng? -->
  <polygon points="250,275 355,315 250,355 145,315" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="250" y="309" text-anchor="middle" font-size="11" fill="#7d3c00">Email đã</text>
  <text x="250" y="325" text-anchor="middle" font-size="11" fill="#7d3c00">tồn tại?</text>

  <!-- Yes email -->
  <line x1="145" y1="315" x2="70" y2="315" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="107" y="307" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Có</text>
  <rect x="10" y="298" width="60" height="38" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5" rx="6"/>
  <text x="40" y="311" text-anchor="middle" font-size="9" fill="#c0392b">Báo lỗi:</text>
  <text x="40" y="324" text-anchor="middle" font-size="9" fill="#c0392b">Email trùng</text>
  <line x1="40" y1="298" x2="40" y2="126" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="40" y1="126" x2="105" y2="126" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- No email -->
  <line x1="250" y1="355" x2="250" y2="380" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="371" font-size="11" fill="#27ae60" font-weight="bold">Không</text>

  <!-- Action: Mã hóa password -->
  <rect x="105" y="385" width="290" height="40" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="20"/>
  <text x="250" y="410" text-anchor="middle" font-size="12" fill="#1a5c2f" font-weight="bold">Mã hóa mật khẩu (BCrypt)</text>
  <line x1="250" y1="425" x2="250" y2="447" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Action: Tạo User -->
  <rect x="105" y="452" width="290" height="40" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="20"/>
  <text x="250" y="467" text-anchor="middle" font-size="11" fill="#1a5c2f" font-weight="bold">Tạo User mới</text>
  <text x="250" y="481" text-anchor="middle" font-size="10" fill="#555">role = EMPLOYEE (mặc định)</text>
  <line x1="250" y1="492" x2="250" y2="512" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Action: Lưu DB -->
  <rect x="105" y="517" width="290" height="40" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="20"/>
  <text x="250" y="542" text-anchor="middle" font-size="12" fill="#1a5c2f" font-weight="bold">Lưu vào cơ sở dữ liệu</text>
  <line x1="250" y1="557" x2="250" y2="580" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Action: Trả về -->
  <rect x="105" y="585" width="290" height="40" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="20"/>
  <text x="250" y="600" text-anchor="middle" font-size="11" fill="#1a5c2f" font-weight="bold">201 Created — Đăng ký thành công</text>
  <text x="250" y="614" text-anchor="middle" font-size="10" fill="#555">Chuyển đến trang đăng nhập</text>
  <line x1="250" y1="625" x2="250" y2="646" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- End -->
  <circle cx="250" cy="657" r="12" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <circle cx="250" cy="657" r="7" fill="#2c3e50"/>
</svg>
