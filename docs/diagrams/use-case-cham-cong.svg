<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, sans-serif">
  <rect width="900" height="520" fill="#f8f9fa" rx="8"/>
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">Sơ đồ Use Case — Quản lý Chấm công</text>
  <!-- System boundary -->
  <rect x="200" y="60" width="480" height="420" fill="white" stroke="#27ae60" stroke-width="2" rx="10" stroke-dasharray="8,4"/>
  <text x="440" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Hệ thống Chấm công</text>
  <!-- Use Cases -->
  <ellipse cx="440" cy="145" rx="100" ry="32" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="440" y="140" text-anchor="middle" font-size="13" fill="#1a5c2f" font-weight="bold">Chấm công vào</text>
  <text x="440" y="157" text-anchor="middle" font-size="11" fill="#1a5c2f">(Check-in)</text>

  <ellipse cx="440" cy="230" rx="100" ry="32" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="440" y="225" text-anchor="middle" font-size="13" fill="#1a5c2f" font-weight="bold">Chấm công ra</text>
  <text x="440" y="242" text-anchor="middle" font-size="11" fill="#1a5c2f">(Check-out)</text>

  <ellipse cx="440" cy="325" rx="110" ry="32" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="440" y="320" text-anchor="middle" font-size="13" fill="#1a5c2f" font-weight="bold">Xem lịch sử</text>
  <text x="440" y="337" text-anchor="middle" font-size="11" fill="#1a5c2f">chấm công</text>

  <ellipse cx="440" cy="425" rx="110" ry="32" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="440" y="420" text-anchor="middle" font-size="13" fill="#1a5c2f" font-weight="bold">Xem báo cáo</text>
  <text x="440" y="437" text-anchor="middle" font-size="11" fill="#1a5c2f">chấm công</text>

  <!-- Actor: Nhân viên (left) -->
  <circle cx="90" cy="185" r="18" fill="#a9dfbf" stroke="#1e8449" stroke-width="2"/>
  <line x1="90" y1="203" x2="90" y2="250" stroke="#1e8449" stroke-width="2"/>
  <line x1="65" y1="222" x2="115" y2="222" stroke="#1e8449" stroke-width="2"/>
  <line x1="90" y1="250" x2="70" y2="278" stroke="#1e8449" stroke-width="2"/>
  <line x1="90" y1="250" x2="110" y2="278" stroke="#1e8449" stroke-width="2"/>
  <text x="90" y="297" text-anchor="middle" font-size="13" fill="#1a5c2f" font-weight="bold">Nhân viên</text>

  <!-- Actor: Quản lý (right) -->
  <circle cx="790" cy="360" r="18" fill="#a9dfbf" stroke="#1e8449" stroke-width="2"/>
  <line x1="790" y1="378" x2="790" y2="425" stroke="#1e8449" stroke-width="2"/>
  <line x1="765" y1="397" x2="815" y2="397" stroke="#1e8449" stroke-width="2"/>
  <line x1="790" y1="425" x2="770" y2="453" stroke="#1e8449" stroke-width="2"/>
  <line x1="790" y1="425" x2="810" y2="453" stroke="#1e8449" stroke-width="2"/>
  <text x="790" y="472" text-anchor="middle" font-size="13" fill="#1a5c2f" font-weight="bold">Quản lý</text>

  <!-- Connections from Nhân viên -->
  <line x1="108" y1="195" x2="340" y2="148" stroke="#555" stroke-width="1.5"/>
  <line x1="108" y1="200" x2="340" y2="230" stroke="#555" stroke-width="1.5"/>
  <line x1="108" y1="210" x2="330" y2="325" stroke="#555" stroke-width="1.5"/>

  <!-- Connections from Quản lý -->
  <line x1="772" y1="368" x2="550" y2="325" stroke="#555" stroke-width="1.5"/>
  <line x1="772" y1="375" x2="550" y2="425" stroke="#555" stroke-width="1.5"/>

  <!-- Note -->
  <rect x="20" y="380" width="155" height="70" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5" rx="5"/>
  <text x="30" y="400" font-size="11" fill="#7d6608" font-weight="bold">Ghi chú:</text>
  <text x="30" y="416" font-size="10" fill="#7d6608">Mỗi nhân viên chỉ</text>
  <text x="30" y="430" font-size="10" fill="#7d6608">được chấm công</text>
  <text x="30" y="444" font-size="10" fill="#7d6608">1 lần / ngày</text>
</svg>
