<svg xmlns="http://www.w3.org/2000/svg" width="850" height="680" viewBox="0 0 850 680" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect width="850" height="680" fill="#f8f9fa" rx="8"/>
  <text x="425" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Activity Diagram — Quản lý Công việc</text>

  <!-- Start -->
  <circle cx="425" cy="58" r="16" fill="#2c3e50"/>
  <line x1="425" y1="74" x2="425" y2="95" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision: Chọn thao tác -->
  <polygon points="425,95 545,138 425,181 305,138" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="425" y="131" text-anchor="middle" font-size="12" fill="#7d3c00">Chọn</text>
  <text x="425" y="148" text-anchor="middle" font-size="12" fill="#7d3c00">thao tác?</text>

  <!-- Branch: XEM -->
  <line x1="305" y1="138" x2="80" y2="138" stroke="#2980b9" stroke-width="2" marker-end="url(#arr)"/>
  <text x="193" y="130" text-anchor="middle" font-size="11" fill="#2980b9" font-weight="bold">Xem</text>
  <rect x="10" y="158" width="140" height="40" fill="#d6eaf8" stroke="#2980b9" stroke-width="2" rx="8"/>
  <text x="80" y="175" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">GET /api/tasks</text>
  <text x="80" y="189" text-anchor="middle" font-size="10" fill="#555">Lấy danh sách CV</text>
  <line x1="80" y1="198" x2="80" y2="615" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="80" y1="615" x2="245" y2="615" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Branch: TẠO -->
  <line x1="425" y1="181" x2="425" y2="206" stroke="#27ae60" stroke-width="2" marker-end="url(#arr)"/>
  <text x="437" y="198" font-size="11" fill="#27ae60" font-weight="bold">Tạo</text>
  <rect x="310" y="210" width="230" height="40" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="425" y="226" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">Nhập thông tin CV</text>
  <text x="425" y="240" text-anchor="middle" font-size="10" fill="#555">{title, description, dueDate, projectId}</text>
  <line x1="425" y1="250" x2="425" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="310" y="274" width="230" height="40" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="425" y="290" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">POST /api/tasks</text>
  <text x="425" y="304" text-anchor="middle" font-size="10" fill="#555">status = PENDING</text>
  <line x1="425" y1="314" x2="425" y2="615" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="425" y1="615" x2="425" y2="615" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Branch: PHÂN CÔNG -->
  <line x1="545" y1="138" x2="660" y2="165" stroke="#8e44ad" stroke-width="2" marker-end="url(#arr)"/>
  <text x="620" y="153" text-anchor="middle" font-size="11" fill="#8e44ad" font-weight="bold">Phân công</text>
  <rect x="640" y="170" width="190" height="40" fill="#e8daef" stroke="#8e44ad" stroke-width="2" rx="8"/>
  <text x="735" y="187" text-anchor="middle" font-size="11" fill="#4a235a" font-weight="bold">Chọn CV + Chọn NV</text>
  <text x="735" y="201" text-anchor="middle" font-size="10" fill="#555">assignedTo: employeeId</text>
  <line x1="735" y1="210" x2="735" y2="232" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="640" y="236" width="190" height="40" fill="#e8daef" stroke="#8e44ad" stroke-width="2" rx="8"/>
  <text x="735" y="252" text-anchor="middle" font-size="11" fill="#4a235a" font-weight="bold">PUT /api/tasks/{id}</text>
  <text x="735" y="266" text-anchor="middle" font-size="10" fill="#4a235a">UPDATE assigned_to</text>
  <line x1="735" y1="276" x2="735" y2="615" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="735" y1="615" x2="605" y2="615" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Branch: CẬP NHẬT TRẠNG THÁI -->
  <line x1="545" y1="138" x2="660" y2="355" stroke="#e67e22" stroke-width="1.5"/>
  <line x1="660" y1="355" x2="660" y2="370" stroke="#e67e22" stroke-width="2" marker-end="url(#arr)"/>
  <text x="630" y="280" text-anchor="middle" font-size="10" fill="#ca6f1e" font-weight="bold">Cập nhật</text>
  <text x="630" y="293" text-anchor="middle" font-size="10" fill="#ca6f1e" font-weight="bold">trạng thái</text>
  <rect x="640" y="375" width="190" height="40" fill="#fdebd0" stroke="#e67e22" stroke-width="2" rx="8"/>
  <text x="735" y="391" text-anchor="middle" font-size="11" fill="#7d3c00" font-weight="bold">Chọn trạng thái mới</text>
  <text x="735" y="405" text-anchor="middle" font-size="10" fill="#7d3c00">{IN_PROGRESS / COMPLETED}</text>

  <!-- Decision: COMPLETED? -->
  <polygon points="735,420 800,450 735,480 670,450" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="735" y="445" text-anchor="middle" font-size="10" fill="#7d3c00">status =</text>
  <text x="735" y="460" text-anchor="middle" font-size="10" fill="#7d3c00">COMPLETED?</text>
  <line x1="735" y1="415" x2="735" y2="420" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Yes: set completedAt -->
  <line x1="800" y1="450" x2="832" y2="450" stroke="#27ae60" stroke-width="1.5"/>
  <text x="820" y="443" font-size="10" fill="#27ae60" font-weight="bold">Có</text>
  <!-- arrow goes back down -->
  <line x1="832" y1="450" x2="832" y2="500" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="660" y="500" width="170" height="38" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="745" y="515" text-anchor="middle" font-size="10" fill="#1a5c2f" font-weight="bold">Set completedAt = now()</text>
  <text x="745" y="529" text-anchor="middle" font-size="10" fill="#555">PUT /api/tasks/{id}</text>
  <line x1="832" y1="500" x2="832" y2="519" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="745" y1="538" x2="745" y2="615" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="745" y1="615" x2="605" y2="615" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- No: just update status -->
  <line x1="670" y1="450" x2="640" y2="450" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="655" y="443" font-size="10" fill="#555" font-weight="bold">Không</text>
  <rect x="542" y="462" width="95" height="38" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5" rx="6"/>
  <text x="590" y="477" text-anchor="middle" font-size="10" fill="#7d3c00" font-weight="bold">UPDATE status</text>
  <text x="590" y="491" text-anchor="middle" font-size="10" fill="#555">PUT /api/tasks/{id}</text>
  <line x1="590" y1="500" x2="590" y2="615" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="590" y1="615" x2="545" y2="615" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Branch: XÓA -->
  <line x1="305" y1="138" x2="175" y2="400" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="175" y1="400" x2="175" y2="415" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="240" y="310" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">Xóa</text>
  <rect x="120" y="420" width="110" height="38" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="8"/>
  <text x="175" y="435" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">DELETE</text>
  <text x="175" y="449" text-anchor="middle" font-size="10" fill="#c0392b">/api/tasks/{id}</text>
  <line x1="175" y1="458" x2="175" y2="615" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="175" y1="615" x2="245" y2="615" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Result -->
  <rect x="245" y="610" width="360" height="40" fill="#aed6f1" stroke="#2980b9" stroke-width="2" rx="8"/>
  <text x="425" y="626" text-anchor="middle" font-size="12" fill="#1a252f" font-weight="bold">Hiển thị danh sách công việc</text>
  <text x="425" y="640" text-anchor="middle" font-size="10" fill="#555">(cập nhật giao diện)</text>
  <line x1="425" y1="650" x2="425" y2="665" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- End -->
  <circle cx="425" cy="670" r="9" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <circle cx="425" cy="670" r="5" fill="#2c3e50"/>
</svg>
