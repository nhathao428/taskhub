<svg xmlns="http://www.w3.org/2000/svg" width="750" height="620" viewBox="0 0 750 620" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect width="750" height="620" fill="#f8f9fa" rx="8"/>
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Activity Diagram — Quản lý Nhân viên</text>

  <!-- Start -->
  <circle cx="375" cy="62" r="18" fill="#2c3e50"/>
  <line x1="375" y1="80" x2="375" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision: Chọn thao tác -->
  <polygon points="375,100 475,140 375,180 275,140" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="375" y="134" text-anchor="middle" font-size="12" fill="#7d3c00">Chọn</text>
  <text x="375" y="150" text-anchor="middle" font-size="12" fill="#7d3c00">thao tác?</text>

  <!-- Branch: XEM -->
  <line x1="275" y1="140" x2="90" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="183" y="132" text-anchor="middle" font-size="11" fill="#2980b9" font-weight="bold">Xem</text>
  <rect x="15" y="160" width="150" height="40" fill="#d6eaf8" stroke="#2980b9" stroke-width="2" rx="8"/>
  <text x="90" y="176" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">GET /api/employees</text>
  <text x="90" y="190" text-anchor="middle" font-size="10" fill="#555">Lấy danh sách NV</text>

  <!-- Branch: THÊM -->
  <line x1="375" y1="180" x2="375" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="387" y="198" font-size="11" fill="#27ae60" font-weight="bold">Thêm mới</text>
  <rect x="275" y="210" width="200" height="40" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="375" y="226" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">Nhập thông tin NV</text>
  <text x="375" y="240" text-anchor="middle" font-size="10" fill="#555">{ho, ten, chucVu, phongBan}</text>
  <line x1="375" y1="250" x2="375" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision: Hợp lệ? -->
  <polygon points="375,270 455,305 375,340 295,305" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="375" y="298" text-anchor="middle" font-size="11" fill="#7d3c00">Dữ liệu</text>
  <text x="375" y="313" text-anchor="middle" font-size="11" fill="#7d3c00">hợp lệ?</text>

  <line x1="455" y1="305" x2="570" y2="305" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="513" y="297" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Không</text>
  <rect x="565" y="288" width="130" height="38" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5" rx="6"/>
  <text x="630" y="303" text-anchor="middle" font-size="10" fill="#c0392b">Hiển thị lỗi</text>
  <text x="630" y="317" text-anchor="middle" font-size="10" fill="#c0392b">validation</text>
  <line x1="630" y1="326" x2="630" y2="230" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="475" y1="230" x2="630" y2="230" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <line x1="375" y1="340" x2="375" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="387" y="353" font-size="11" fill="#27ae60" font-weight="bold">Có</text>

  <rect x="275" y="365" width="200" height="40" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="375" y="381" text-anchor="middle" font-size="11" fill="#1a252f" font-weight="bold">POST /api/employees</text>
  <text x="375" y="395" text-anchor="middle" font-size="10" fill="#555">Lưu NV mới vào DB</text>

  <!-- Branch: SỬA -->
  <line x1="475" y1="140" x2="600" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="545" y="165" text-anchor="middle" font-size="11" fill="#e67e22" font-weight="bold">Sửa</text>
  <rect x="575" y="200" width="155" height="40" fill="#fdebd0" stroke="#e67e22" stroke-width="2" rx="8"/>
  <text x="652" y="216" text-anchor="middle" font-size="11" fill="#7d3c00" font-weight="bold">Chọn NV cần sửa</text>
  <text x="652" y="230" text-anchor="middle" font-size="10" fill="#7d3c00">PUT /api/employees/{id}</text>

  <!-- Branch: XÓA -->
  <line x1="475" y1="140" x2="600" y2="440" stroke="#555" stroke-width="2"/>
  <line x1="600" y1="440" x2="600" y2="455" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="545" y="300" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Xóa</text>
  <rect x="575" y="460" width="155" height="40" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="8"/>
  <text x="652" y="476" text-anchor="middle" font-size="11" fill="#7d3c00" font-weight="bold">Chọn NV cần xóa</text>
  <text x="652" y="490" text-anchor="middle" font-size="10" fill="#c0392b">DELETE /api/employees/{id}</text>

  <!-- Merge to Display -->
  <rect x="130" y="530" width="430" height="40" fill="#aed6f1" stroke="#2980b9" stroke-width="2" rx="8"/>
  <text x="345" y="555" text-anchor="middle" font-size="12" fill="#1a252f" font-weight="bold">Hiển thị danh sách nhân viên cập nhật</text>

  <!-- Join lines from all branches -->
  <line x1="90" y1="200" x2="90" y2="550" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="90" y1="550" x2="130" y2="550" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="375" y1="405" x2="375" y2="530" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="652" y1="240" x2="652" y2="550" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="560" y1="550" x2="652" y2="550" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="652" y1="500" x2="652" y2="550" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>

  <line x1="345" y1="570" x2="345" y2="588" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- End -->
  <circle cx="345" cy="600" r="12" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <circle cx="345" cy="600" r="7" fill="#2c3e50"/>
</svg>
