<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="40" y="44" fill="#FFFFFF" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold">ĐIỂM NHẤN: CHẤM CÔNG GPS &amp; GEOFENCE</text>
  <text x="1240" y="44" text-anchor="end" fill="#75CEC8" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14">PHẦN 3 · ĐIỂM NHẤN</text>

  <rect x="0" y="70" width="1280" height="50" fill="#E0F2F1"/>
  <text x="640" y="100" text-anchor="middle" fill="#147c79" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" font-style="italic">Đa văn phòng · Tính khoảng cách Haversine · Phát hiện GPS giả · Manager duyệt PENDING</text>

  <g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <!-- Left: Geofence diagram -->
    <text x="40" y="160" fill="#003366" font-size="18" font-weight="bold">▸ MÔ HÌNH GEOFENCE</text>

    <!-- Map circle -->
    <circle cx="280" cy="350" r="135" fill="#E0F2F1" stroke="#147c79" stroke-width="3" stroke-dasharray="5,3"/>
    <circle cx="280" cy="350" r="135" fill="none" stroke="#147c79" stroke-width="1" opacity="0.3"/>
    <text x="280" y="225" text-anchor="middle" fill="#147c79" font-size="13" font-weight="bold">RADIUS 100m</text>

    <!-- Office marker (center) -->
    <rect x="265" y="335" width="30" height="30" fill="#003366" rx="2"/>
    <text x="280" y="356" text-anchor="middle" fill="#FFFFFF" font-size="14">🏢</text>
    <text x="280" y="390" text-anchor="middle" fill="#003366" font-size="13" font-weight="bold">TRỤ SỞ HUTECH</text>
    <text x="280" y="408" text-anchor="middle" fill="#555555" font-size="11">10.802, 106.715</text>

    <!-- Employee inside -->
    <circle cx="220" cy="300" r="14" fill="#147c79"/>
    <text x="220" y="305" text-anchor="middle" fill="#FFFFFF" font-size="13">👤</text>
    <text x="155" y="290" fill="#147c79" font-size="11" font-weight="bold">✓ APPROVED</text>
    <text x="155" y="304" fill="#147c79" font-size="10">d = 47m</text>

    <!-- Employee outside -->
    <circle cx="450" cy="270" r="14" fill="#E48913"/>
    <text x="450" y="275" text-anchor="middle" fill="#FFFFFF" font-size="13">👤</text>
    <text x="475" y="265" fill="#E48913" font-size="11" font-weight="bold">⏳ PENDING</text>
    <text x="475" y="279" fill="#E48913" font-size="10">d = 180m</text>

    <!-- Employee mocked -->
    <circle cx="180" cy="450" r="14" fill="#CC0000"/>
    <text x="180" y="455" text-anchor="middle" fill="#FFFFFF" font-size="13">👤</text>
    <text x="60" y="475" fill="#CC0000" font-size="11" font-weight="bold">⚠ MOCKED GPS</text>
    <text x="60" y="489" fill="#CC0000" font-size="10">isMocked=true → PENDING</text>

    <!-- Right: Logic flow -->
    <text x="540" y="160" fill="#003366" font-size="18" font-weight="bold">▸ LUỒNG XỬ LÝ CHECK-IN</text>

    <rect x="540" y="180" width="700" height="50" fill="#003366" rx="4"/>
    <text x="555" y="212" fill="#FFFFFF" font-size="14" font-weight="bold">① Client gửi lat · lng · isMocked</text>

    <text x="555" y="252" fill="#003366" font-size="13" font-weight="bold">② applyLocation(attendance, loc)</text>

    <rect x="555" y="265" width="685" height="46" fill="#FFE5E5" stroke="#CC0000" rx="4"/>
    <text x="570" y="290" fill="#CC0000" font-size="13" font-weight="bold">  if (loc == null) → PENDING_REVIEW</text>
    <text x="570" y="305" fill="#555555" font-size="11">  Web không cấp quyền GPS</text>

    <rect x="555" y="320" width="685" height="46" fill="#FFE5E5" stroke="#CC0000" rx="4"/>
    <text x="570" y="345" fill="#CC0000" font-size="13" font-weight="bold">  if (isMocked == true) → PENDING_REVIEW</text>
    <text x="570" y="360" fill="#555555" font-size="11">  Mobile phát hiện fake GPS app</text>

    <rect x="555" y="375" width="685" height="46" fill="#FFF4E5" stroke="#E48913" rx="4"/>
    <text x="570" y="400" fill="#E48913" font-size="13" font-weight="bold">  GeofenceService.findNearestActive()</text>
    <text x="570" y="415" fill="#555555" font-size="11">  Haversine formula tính distance ⤍ office gần nhất</text>

    <rect x="555" y="430" width="685" height="46" fill="#E0F2F1" stroke="#147c79" rx="4"/>
    <text x="570" y="455" fill="#147c79" font-size="13" font-weight="bold">  if (withinRadius) → APPROVED, else → PENDING</text>
    <text x="570" y="470" fill="#555555" font-size="11">  Manager review PENDING qua PATCH /api/attendance/{id}/review</text>

    <!-- Bottom: tech stack -->
    <rect x="40" y="540" width="1200" height="100" fill="#F5F7FA" stroke="#E5E7EB" rx="6"/>
    <text x="60" y="568" fill="#003366" font-size="14" font-weight="bold">▸ STACK</text>
    <text x="60" y="595" fill="#555555" font-size="13">Frontend: <tspan fill="#147c79" font-weight="bold">Leaflet</tspan> · OpenStreetMap tiles · React Leaflet marker drag</text>
    <text x="60" y="618" fill="#555555" font-size="13">Mobile: <tspan fill="#147c79" font-weight="bold">geolocator</tspan> Dart package · native GPS · mock detection</text>
    <text x="730" y="595" fill="#555555" font-size="13">Backend: <tspan fill="#147c79" font-weight="bold">Haversine</tspan> formula thuần Java · không lib bên ngoài</text>
    <text x="730" y="618" fill="#555555" font-size="13">DB: <tspan fill="#147c79" font-weight="bold">office_locations</tspan> · attendances.lat/lng/distance/mock</text>
  </g>

  <rect x="0" y="665" width="1280" height="55" fill="#F5F7FA"/>
  <text x="40" y="697" fill="#555555" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13">Nguyễn Nhật Hảo · 23DTHC1 · 2380612688</text>
  <text x="1240" y="697" text-anchor="end" fill="#999999" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13">11 / 16</text>
</svg>
