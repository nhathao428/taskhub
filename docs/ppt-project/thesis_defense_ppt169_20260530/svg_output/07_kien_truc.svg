<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="40" y="44" fill="#FFFFFF" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold">KIẾN TRÚC TỔNG THỂ HỆ THỐNG</text>
  <text x="1240" y="44" text-anchor="end" fill="#75CEC8" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14">PHẦN 2 · CƠ SỞ LÝ THUYẾT</text>

  <rect x="0" y="70" width="1280" height="50" fill="#F5F7FA"/>
  <text x="640" y="100" text-anchor="middle" fill="#003366" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" font-style="italic">Kiến trúc 3 tầng: Client — Application — Data, giao tiếp qua REST API + JWT</text>

  <!-- Layer 1: Clients -->
  <g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <text x="60" y="170" fill="#999999" font-size="13" letter-spacing="3">TẦNG 1 · CLIENT</text>
    <rect x="60" y="185" width="280" height="120" fill="#E0F2F1" stroke="#147c79" stroke-width="2" rx="8"/>
    <text x="200" y="220" text-anchor="middle" fill="#147c79" font-size="22" font-weight="bold">⌘ WEB</text>
    <text x="200" y="248" text-anchor="middle" fill="#003366" font-size="16" font-weight="600">React + Vite</text>
    <text x="200" y="270" text-anchor="middle" fill="#555555" font-size="13">Manager · Admin · Employee</text>
    <text x="200" y="290" text-anchor="middle" fill="#999999" font-size="12">localhost:5173</text>

    <rect x="360" y="185" width="280" height="120" fill="#E1F5FE" stroke="#0066CC" stroke-width="2" rx="8"/>
    <text x="500" y="220" text-anchor="middle" fill="#0066CC" font-size="22" font-weight="bold">▣ MOBILE</text>
    <text x="500" y="248" text-anchor="middle" fill="#003366" font-size="16" font-weight="600">Flutter (Dart)</text>
    <text x="500" y="270" text-anchor="middle" fill="#555555" font-size="13">iOS · Android · Web</text>
    <text x="500" y="290" text-anchor="middle" fill="#999999" font-size="12">Native GPS</text>

    <!-- Arrows pointing down -->
    <path d="M 200 305 L 200 340 M 195 335 L 200 345 L 205 335" fill="none" stroke="#003366" stroke-width="2"/>
    <path d="M 500 305 L 500 340 M 495 335 L 500 345 L 505 335" fill="none" stroke="#003366" stroke-width="2"/>
    <text x="350" y="328" fill="#999999" font-size="12" font-style="italic">HTTPS · JWT Bearer</text>

    <!-- Layer 2: Application -->
    <text x="60" y="370" fill="#999999" font-size="13" letter-spacing="3">TẦNG 2 · APPLICATION</text>
    <rect x="60" y="385" width="800" height="155" fill="#FFFFFF" stroke="#003366" stroke-width="3" rx="8"/>
    <rect x="60" y="385" width="800" height="36" fill="#003366" rx="8"/>
    <rect x="60" y="412" width="800" height="9" fill="#003366"/>
    <text x="80" y="412" fill="#FFFFFF" font-size="16" font-weight="bold">⚙ Spring Boot Backend · REST API</text>
    <rect x="80" y="445" width="170" height="80" fill="#F5F7FA" stroke="#003366" stroke-width="1" rx="4"/>
    <text x="165" y="475" text-anchor="middle" fill="#003366" font-size="14" font-weight="bold">Filter Chain</text>
    <text x="165" y="495" text-anchor="middle" fill="#555555" font-size="11">ApiVersion · RateLimit</text>
    <text x="165" y="510" text-anchor="middle" fill="#555555" font-size="11">JWT Auth · CORS</text>
    <rect x="265" y="445" width="170" height="80" fill="#F5F7FA" stroke="#003366" stroke-width="1" rx="4"/>
    <text x="350" y="475" text-anchor="middle" fill="#003366" font-size="14" font-weight="bold">Controllers</text>
    <text x="350" y="495" text-anchor="middle" fill="#555555" font-size="11">10 REST resources</text>
    <text x="350" y="510" text-anchor="middle" fill="#555555" font-size="11">@PreAuthorize roles</text>
    <rect x="450" y="445" width="170" height="80" fill="#F5F7FA" stroke="#003366" stroke-width="1" rx="4"/>
    <text x="535" y="475" text-anchor="middle" fill="#003366" font-size="14" font-weight="bold">Services</text>
    <text x="535" y="495" text-anchor="middle" fill="#555555" font-size="11">Business logic</text>
    <text x="535" y="510" text-anchor="middle" fill="#555555" font-size="11">Transaction + Cache</text>
    <rect x="635" y="445" width="200" height="80" fill="#F5F7FA" stroke="#9333EA" stroke-width="1" rx="4"/>
    <text x="735" y="475" text-anchor="middle" fill="#9333EA" font-size="14" font-weight="bold">AiSuggestionService</text>
    <text x="735" y="495" text-anchor="middle" fill="#555555" font-size="11">Prompt-injection block</text>
    <text x="735" y="510" text-anchor="middle" fill="#555555" font-size="11">PII redaction</text>

    <!-- Arrow to layer 3 -->
    <path d="M 460 540 L 460 580 M 455 575 L 460 585 L 465 575" fill="none" stroke="#003366" stroke-width="2"/>

    <!-- Layer 3: Data -->
    <text x="60" y="600" fill="#999999" font-size="13" letter-spacing="3">TẦNG 3 · DATA</text>
    <rect x="60" y="615" width="380" height="35" fill="#FFF4E5" stroke="#E48913" stroke-width="2" rx="4"/>
    <text x="250" y="638" text-anchor="middle" fill="#E48913" font-size="15" font-weight="bold">▤ PostgreSQL 16 · 6 bảng · Flyway</text>
    <rect x="460" y="615" width="380" height="35" fill="#FFE5E5" stroke="#CC0000" stroke-width="2" rx="4"/>
    <text x="650" y="638" text-anchor="middle" fill="#CC0000" font-size="15" font-weight="bold">⚡ Redis 7 · @Cacheable · TTL 5min</text>

    <!-- External AI -->
    <rect x="900" y="185" width="320" height="200" fill="#FAF5FF" stroke="#9333EA" stroke-width="2" rx="8"/>
    <text x="1060" y="225" text-anchor="middle" fill="#9333EA" font-size="22" font-weight="bold">✨ EXTERNAL</text>
    <text x="1060" y="255" text-anchor="middle" fill="#003366" font-size="16" font-weight="600">Google Gemini API</text>
    <text x="1060" y="278" text-anchor="middle" fill="#555555" font-size="13">gemini-2.5-flash</text>
    <line x1="940" y1="295" x2="1180" y2="295" stroke="#9333EA" opacity="0.3"/>
    <text x="1060" y="320" text-anchor="middle" fill="#555555" font-size="12">REST · HTTP/2 · JSON mode</text>
    <text x="1060" y="345" text-anchor="middle" fill="#555555" font-size="12">x-goog-api-key header</text>
    <text x="1060" y="370" text-anchor="middle" fill="#9333EA" font-size="13" font-style="italic">Optional: qua PromptShield</text>
    <path d="M 900 285 L 860 460 M 868 459 L 855 462 L 859 450" fill="none" stroke="#9333EA" stroke-width="2" stroke-dasharray="4,3"/>
  </g>

  <rect x="0" y="665" width="1280" height="55" fill="#F5F7FA"/>
  <text x="40" y="697" fill="#555555" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13">Nguyễn Nhật Hảo · 23DTHC1 · 2380612688</text>
  <text x="1240" y="697" text-anchor="end" fill="#999999" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13">7 / 16</text>
</svg>
