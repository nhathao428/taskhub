<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="40" y="44" fill="#FFFFFF" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold">ĐIỂM NHẤN: AI GỢI Ý NHÂN VIÊN</text>
  <text x="1240" y="44" text-anchor="end" fill="#75CEC8" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14">PHẦN 3 · ĐIỂM NHẤN</text>

  <rect x="0" y="70" width="1280" height="50" fill="#FAF5FF"/>
  <text x="640" y="100" text-anchor="middle" fill="#9333EA" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" font-style="italic">Manager nhập task → Backend gom dữ liệu → Gemini xếp hạng → TOP 5 nhân viên phù hợp</text>

  <!-- 4-step flow -->
  <g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <!-- Step 1 -->
    <circle cx="170" cy="220" r="50" fill="#9333EA"/>
    <text x="170" y="230" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="bold">1</text>
    <text x="170" y="295" text-anchor="middle" fill="#003366" font-size="18" font-weight="bold">Nhập yêu cầu</text>
    <text x="170" y="318" text-anchor="middle" fill="#555555" font-size="13">Manager nhập</text>
    <text x="170" y="335" text-anchor="middle" fill="#555555" font-size="13">tiêu đề · mô tả · skills</text>
    <path d="M 235 220 L 305 220" stroke="#9333EA" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <circle cx="370" cy="220" r="50" fill="#9333EA"/>
    <text x="370" y="230" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="bold">2</text>
    <text x="370" y="295" text-anchor="middle" fill="#003366" font-size="18" font-weight="bold">Gom dữ liệu</text>
    <text x="370" y="318" text-anchor="middle" fill="#555555" font-size="13">Backend tổng hợp</text>
    <text x="370" y="335" text-anchor="middle" fill="#555555" font-size="13">lịch sử + chấm công</text>
    <path d="M 435 220 L 505 220" stroke="#9333EA" stroke-width="3"/>

    <!-- Step 3 -->
    <circle cx="570" cy="220" r="50" fill="#9333EA"/>
    <text x="570" y="230" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="bold">3</text>
    <text x="570" y="295" text-anchor="middle" fill="#003366" font-size="18" font-weight="bold">Gọi Gemini</text>
    <text x="570" y="318" text-anchor="middle" fill="#555555" font-size="13">Build prompt</text>
    <text x="570" y="335" text-anchor="middle" fill="#555555" font-size="13">→ gemini-2.5-flash</text>
    <path d="M 635 220 L 705 220" stroke="#9333EA" stroke-width="3"/>

    <!-- Step 4 -->
    <circle cx="770" cy="220" r="50" fill="#147c79"/>
    <text x="770" y="230" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="bold">4</text>
    <text x="770" y="295" text-anchor="middle" fill="#003366" font-size="18" font-weight="bold">Trả kết quả</text>
    <text x="770" y="318" text-anchor="middle" fill="#555555" font-size="13">TOP 5 nhân viên</text>
    <text x="770" y="335" text-anchor="middle" fill="#555555" font-size="13">kèm reasoning</text>

    <!-- Cache box -->
    <rect x="870" y="170" width="370" height="160" fill="#FFE5E5" stroke="#CC0000" stroke-width="2" rx="8"/>
    <text x="1055" y="200" text-anchor="middle" fill="#CC0000" font-size="18" font-weight="bold">⚡ REDIS CACHE</text>
    <line x1="900" y1="215" x2="1210" y2="215" stroke="#CC0000" opacity="0.3"/>
    <text x="1055" y="245" text-anchor="middle" fill="#1A1A1C" font-size="14">Request giống nhau:</text>
    <text x="1055" y="275" text-anchor="middle" fill="#CC0000" font-size="28" font-weight="bold">1450ms → &lt; 10ms</text>
    <text x="1055" y="305" text-anchor="middle" fill="#555555" font-size="12">@Cacheable · TTL 5 phút</text>

    <!-- Security row -->
    <rect x="40" y="395" width="1200" height="2" fill="#E5E7EB"/>
    <text x="40" y="430" fill="#003366" font-size="18" font-weight="bold">🛡 BẢO MẬT PROMPT</text>
    <text x="40" y="455" fill="#999999" font-size="13">Defense-in-depth — backend block trước khi gửi Gemini</text>

    <!-- Security cards -->
    <rect x="40" y="475" width="280" height="155" fill="#FAFAF9" stroke="#003366" rx="6"/>
    <text x="55" y="500" fill="#003366" font-size="14" font-weight="bold">PII Redaction</text>
    <text x="55" y="525" fill="#555555" font-size="12">▸ Email · CC · phone · CCCD</text>
    <text x="55" y="545" fill="#555555" font-size="12">▸ Mask bằng regex trước prompt</text>
    <text x="55" y="565" fill="#555555" font-size="12">▸ → [EMAIL] [CARD] [PHONE]</text>
    <text x="55" y="608" fill="#147c79" font-size="13" font-weight="bold">✓ Không leak PII sang LLM</text>

    <rect x="340" y="475" width="280" height="155" fill="#FAFAF9" stroke="#003366" rx="6"/>
    <text x="355" y="500" fill="#003366" font-size="14" font-weight="bold">Injection Detection</text>
    <text x="355" y="525" fill="#555555" font-size="12">▸ Regex: "ignore previous"</text>
    <text x="355" y="545" fill="#555555" font-size="12">▸ Block: DAN · jailbreak</text>
    <text x="355" y="565" fill="#555555" font-size="12">▸ Block: &lt;|im_start|&gt;</text>
    <text x="355" y="608" fill="#147c79" font-size="13" font-weight="bold">✓ Reject 422 trước Gemini</text>

    <rect x="640" y="475" width="280" height="155" fill="#FAFAF9" stroke="#003366" rx="6"/>
    <text x="655" y="500" fill="#003366" font-size="14" font-weight="bold">Sanitization</text>
    <text x="655" y="525" fill="#555555" font-size="12">▸ Strip control chars</text>
    <text x="655" y="545" fill="#555555" font-size="12">▸ Cap field length 500</text>
    <text x="655" y="565" fill="#555555" font-size="12">▸ Block === ``` markers</text>
    <text x="655" y="608" fill="#147c79" font-size="13" font-weight="bold">✓ Prompt sạch</text>

    <rect x="940" y="475" width="300" height="155" fill="#003366" rx="6"/>
    <text x="955" y="500" fill="#FFFFFF" font-size="14" font-weight="bold">Rate Limit</text>
    <text x="955" y="525" fill="#75CEC8" font-size="12">▸ 10 req/phút/IP cho AI</text>
    <text x="955" y="545" fill="#75CEC8" font-size="12">▸ Bảo vệ quota Gemini</text>
    <text x="955" y="565" fill="#75CEC8" font-size="12">▸ Per-IP per-bucket</text>
    <text x="955" y="608" fill="#75CEC8" font-size="13" font-weight="bold">✓ 429 nếu vượt</text>
  </g>

  <rect x="0" y="665" width="1280" height="55" fill="#F5F7FA"/>
  <text x="40" y="697" fill="#555555" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13">Nguyễn Nhật Hảo · 23DTHC1 · 2380612688</text>
  <text x="1240" y="697" text-anchor="end" fill="#999999" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13">10 / 16</text>
</svg>
