server.port=5000

# PostgreSQL — DB_URL takes precedence; falls back to composing from
# DB_HOST/DB_PORT/DB_NAME (useful for managed DBs like Render that expose
# host/port/database as separate env vars rather than a JDBC URL).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:task_management_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — prod nên set DDL_AUTO=validate để Hibernate không tự ý đổi schema
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — expiration 2h (7,200,000 ms) để giảm rủi ro token bị đánh cắp
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:7200000}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=${CACHE_TYPE:none}

# Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}

# Rate limit chống spam — số request tối đa mỗi IP trong 1 phút.
# trust-forwarded-header=true chỉ khi backend nằm sau reverse proxy tin cậy (Caddy/Nginx).
app.ratelimit.auth=${RATELIMIT_AUTH:20}
app.ratelimit.ai=${RATELIMIT_AI:10}
app.ratelimit.trust-forwarded-header=${RATELIMIT_TRUST_FORWARDED:false}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Springdoc / Swagger UI — tắt ở prod bằng SWAGGER_ENABLED=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
