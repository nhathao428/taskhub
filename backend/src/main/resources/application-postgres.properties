server.port=5000

# PostgreSQL — DB_URL takes precedence; falls back to composing from
# DB_HOST/DB_PORT/DB_NAME (useful for managed DBs like Render that expose
# host/port/database as separate env vars rather than a JDBC URL).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:task_management_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — schema do Flyway quản lý; Hibernate chỉ validate khớp với entity.
# Override DDL_AUTO=update tạm thời nếu cần thử nghiệm schema thay đổi nóng.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway — bật mặc định ở postgres profile. Existing DBs được baseline ở v1 mà không chạy V1.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT — expiration 2h (7,200,000 ms) để giảm rủi ro token bị đánh cắp
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:7200000}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=${CACHE_TYPE:none}

# Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}

# Groq — fallback tự động khi Gemini trả 429 (rate limit). Free tier Groq (~14.400 req/ngày)
# cao hơn nhiều Gemini Flash (~1.500/ngày). Để trống GROQ_API_KEY = không fallback.
groq.api.key=${GROQ_API_KEY:}
groq.api.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.api.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}

# Resend — gửi email thật cho luồng "quên mật khẩu". Xem giải thích chi tiết (giới hạn free
# tier onboarding@resend.dev) trong application.properties.
resend.api.key=${RESEND_API_KEY:}
resend.api.from=${RESEND_FROM:TaskHub <onboarding@resend.dev>}

# Rate limit chống spam — số request tối đa mỗi IP trong 1 phút.
# trust-forwarded-header=true chỉ khi backend nằm sau reverse proxy tin cậy (Caddy/Nginx).
app.ratelimit.auth=${RATELIMIT_AUTH:20}
app.ratelimit.ai=${RATELIMIT_AI:10}
app.ratelimit.employees=${RATELIMIT_EMPLOYEES:40}
app.ratelimit.trust-forwarded-header=${RATELIMIT_TRUST_FORWARDED:false}

# Quên mật khẩu — production: KHÔNG bao giờ trả OTP trong response (expose-token=false).
# OTP 6 số chỉ đi qua email (Resend) — xem RESEND_API_KEY.
app.password-reset.token-ttl-minutes=${PWD_RESET_TTL_MINUTES:10}
app.password-reset.expose-token=${PWD_RESET_EXPOSE_TOKEN:false}
app.password-reset.max-attempts=${PWD_RESET_MAX_ATTEMPTS:5}

# Nhận diện khuôn mặt — xem giải thích chi tiết trong application.properties.
# Để trống BIOMETRIC_KEY = tắt tính năng, check-in bằng GPS vẫn chạy bình thường.
# Lưu ý deploy: service Python cần ~1-2GB RAM cho PyTorch, KHÔNG vừa free tier 512MB.
app.biometric.key=${BIOMETRIC_KEY:}
app.face.service-url=${FACE_SERVICE_URL:http://127.0.0.1:8000}
app.face.threshold=${FACE_THRESHOLD:0.65}
app.face.require-liveness=${FACE_REQUIRE_LIVENESS:true}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Springdoc / Swagger UI — TẮT mặc định ở prod. Bật explicit qua SWAGGER_ENABLED=true.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
