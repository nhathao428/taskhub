server.port=5000

# DataSource — defaults to H2 in-memory for dev; override with env vars for PostgreSQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:task_management_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 console (dev only)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA / Hibernate
# Dev (H2 mặc định): Hibernate tự tạo schema, Flyway TẮT (V1 dùng cú pháp Postgres).
# Postgres profile / prod: Flyway BẬT + Hibernate validate (xem application-postgres.properties).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# Flyway — mặc định tắt ở dev (H2). Được bật ở postgres profile.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT — expiration 2h (7,200,000 ms) để giảm rủi ro token bị đánh cắp
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:7200000}

# Redis (set CACHE_TYPE=redis khi có Redis server; mặc định none để dev local không bị crash)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=${CACHE_TYPE:none}
spring.data.redis.repositories.enabled=false
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# AI: dùng OpenAI-compatible chat completions (/chat/completions). Hai destination
# phổ biến:
#   - Gemini OpenAI-compat (default): https://generativelanguage.googleapis.com/v1beta/openai
#   - PromptShield gateway:           http://localhost:8080/v1 (enforce PII/injection policy)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}

# Groq — fallback tự động khi Gemini trả 429 (rate limit). Free tier Groq (~14.400 req/ngày)
# cao hơn nhiều Gemini Flash (~1.500/ngày). Để trống GROQ_API_KEY = không fallback.
groq.api.key=${GROQ_API_KEY:}
groq.api.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.api.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}

# Rate limit chống spam — số request tối đa mỗi IP trong 1 phút.
# trust-forwarded-header=true chỉ khi backend nằm sau reverse proxy tin cậy (Caddy/Nginx).
app.ratelimit.auth=${RATELIMIT_AUTH:20}
app.ratelimit.ai=${RATELIMIT_AI:10}
# employees + attendance (chứa toạ độ GPS chấm công) — chặn kéo dữ liệu hàng loạt nếu 1
# tài khoản Manager bị lộ/chiếm. Audit tháng 8/2026: 2 nhóm này trước đó không có rate limit.
app.ratelimit.employees=${RATELIMIT_EMPLOYEES:40}
app.ratelimit.trust-forwarded-header=${RATELIMIT_TRUST_FORWARDED:false}

# Quên mật khẩu — mã OTP 6 chữ số có hiệu lực 10 phút (dùng 1 lần), khoá sau
# app.password-reset.max-attempts lần nhập sai (chống brute-force 10^6 khả năng).
# expose-token=true: dev vẫn trả OTP thẳng trong response để thao tác end-to-end mà không cần
# mở hộp thư (dùng song song với gửi email thật nếu đã cấu hình RESEND_API_KEY bên dưới).
# PHẢI để false ở production (xem application-postgres.properties) — khi đó OTP chỉ đi qua email.
app.password-reset.token-ttl-minutes=${PWD_RESET_TTL_MINUTES:10}
app.password-reset.expose-token=${PWD_RESET_EXPOSE_TOKEN:true}
app.password-reset.max-attempts=${PWD_RESET_MAX_ATTEMPTS:5}

# Resend — gửi email thật cho luồng "quên mật khẩu" (POST https://api.resend.com/emails).
# Free tier CHƯA verify domain riêng: from bắt buộc là onboarding@resend.dev, và Resend chỉ
# cho gửi tới đúng email dùng để đăng ký tài khoản Resend (giới hạn sandbox chống spam) — gửi
# tới email khác sẽ bị Resend từ chối. Verify domain tại resend.com/domains rồi đổi RESEND_FROM
# để gửi được tới bất kỳ ai. Để trống RESEND_API_KEY = không gửi email (chỉ log, như trước).
resend.api.key=${RESEND_API_KEY:}
resend.api.from=${RESEND_FROM:TaskHub <onboarding@resend.dev>}

# --- Nhận diện khuôn mặt cho check-in (đồ án chuyên ngành) ---
# Khoá mã hoá dữ liệu sinh trắc học (AES-256, 32 byte encode base64). Tạo bằng:
#     openssl rand -base64 32
# Để TRỐNG = tắt hoàn toàn tính năng khuôn mặt; check-in bằng GPS vẫn chạy bình thường.
# CẢNH BÁO: mất khoá = mất toàn bộ khuôn mặt đã đăng ký, nhân viên phải đăng ký lại.
app.biometric.key=${BIOMETRIC_KEY:}

# URL service Python xử lý AI (ml/face-recognition/api_service.py).
# Chạy service: uvicorn api_service:app --host 127.0.0.1 --port 8000
app.face.service-url=${FACE_SERVICE_URL:http://127.0.0.1:8000}

# Ngưỡng cosine similarity coi là cùng một người. Cùng người thường 0.7-1.0, khác người
# thường dưới 0.4-0.5. Chỉnh lại sau khi chạy evaluate.py trên dữ liệu thật để cân FAR/FRR.
app.face.threshold=${FACE_THRESHOLD:0.65}

# Bắt buộc qua kiểm tra chống giả mạo (chớp mắt) mới cho check-in.
# true = thiếu khung hình liveness sẽ bị đẩy sang PENDING_REVIEW.
app.face.require-liveness=${FACE_REQUIRE_LIVENESS:true}

# CORS allowed origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Admin seed account (seeded on first startup if not present)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD}

# Employee seed account (mẫu) — chỉ seed khi đặt EMPLOYEE_PASSWORD, giống ManagerSeeder.
# Không có mật khẩu mặc định để tránh tạo tài khoản yếu/backdoor.
app.employee.username=${EMPLOYEE_USERNAME:employee1}
app.employee.email=${EMPLOYEE_EMAIL:employee@example.com}
app.employee.password=${EMPLOYEE_PASSWORD:}

# Pool nhân viên mẫu để test gợi ý AI — mặc định TẮT, bật bằng SEED_SAMPLE_EMPLOYEES=true.
# Tạo hồ sơ nhân viên (không kèm tài khoản đăng nhập) với kỹ năng đa dạng.
app.seed.sample-employees=${SEED_SAMPLE_EMPLOYEES:false}
app.seed.sample-employees-count=${SEED_SAMPLE_EMPLOYEES_COUNT:30}

# Springdoc / Swagger UI — TẮT mặc định (security: tránh expose API schema ở prod).
# Bật tường minh khi dev bằng SWAGGER_ENABLED=true.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# To switch to PostgreSQL: set env var SPRING_PROFILES_ACTIVE=postgres
