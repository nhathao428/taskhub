server.port=5000

# DataSource — defaults to H2 in-memory for dev; override with env vars for PostgreSQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:task_management_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 console (dev only)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA / Hibernate
# Dev (H2 mặc định): Hibernate tự tạo schema, Flyway TẮT (V1 dùng cú pháp Postgres).
# Postgres profile / prod: Flyway BẬT + Hibernate validate (xem application-postgres.properties).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# Flyway — mặc định tắt ở dev (H2). Được bật ở postgres profile.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT — expiration 2h (7,200,000 ms) để giảm rủi ro token bị đánh cắp
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:7200000}

# Redis (set CACHE_TYPE=redis khi có Redis server; mặc định none để dev local không bị crash)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=${CACHE_TYPE:none}
spring.data.redis.repositories.enabled=false
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# AI: dùng OpenAI-compatible chat completions (/chat/completions). Hai destination
# phổ biến:
#   - Gemini OpenAI-compat (default): https://generativelanguage.googleapis.com/v1beta/openai
#   - PromptShield gateway:           http://localhost:8080/v1 (enforce PII/injection policy)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}

# Rate limit chống spam — số request tối đa mỗi IP trong 1 phút.
# trust-forwarded-header=true chỉ khi backend nằm sau reverse proxy tin cậy (Caddy/Nginx).
app.ratelimit.auth=${RATELIMIT_AUTH:20}
app.ratelimit.ai=${RATELIMIT_AI:10}
app.ratelimit.trust-forwarded-header=${RATELIMIT_TRUST_FORWARDED:false}

# Quên mật khẩu — token đặt lại có hiệu lực 15 phút (dùng 1 lần).
# expose-token=true: vì dev CHƯA gửi email, trả token/link thẳng trong response để thao tác
# end-to-end. PHẢI để false ở production (xem application-postgres.properties) — khi đó token
# chỉ đi qua email. reset-url-base là URL trang đặt lại của frontend.
app.password-reset.token-ttl-minutes=${PWD_RESET_TTL_MINUTES:15}
app.password-reset.expose-token=${PWD_RESET_EXPOSE_TOKEN:true}
app.password-reset.reset-url-base=${PWD_RESET_URL_BASE:http://localhost:5173/reset-password}

# CORS allowed origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Admin seed account (seeded on first startup if not present)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD}

# Springdoc / Swagger UI — TẮT mặc định (security: tránh expose API schema ở prod).
# Bật tường minh khi dev bằng SWAGGER_ENABLED=true.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# To switch to PostgreSQL: set env var SPRING_PROFILES_ACTIVE=postgres
