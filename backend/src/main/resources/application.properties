server.port=5000

# DataSource — defaults to H2 in-memory for dev; override with env vars for PostgreSQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:task_management_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${JPA_PLATFORM:org.hibernate.dialect.H2Dialect}

# JWT
app.jwt.secret=${JWT_SECRET:myDefaultSecretKeyThatIsAtLeast256BitsLong1234567890}
app.jwt.expiration=86400000

# Redis (graceful fallback: if Redis is unavailable, caching is simply skipped)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis

# OpenAI — set OPENAI_API_KEY environment variable to enable AI suggestions
openai.api.key=${OPENAI_API_KEY:}
openai.api.model=${OPENAI_MODEL:gpt-4o-mini}

# Springdoc / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# To switch to PostgreSQL: set env var SPRING_PROFILES_ACTIVE=postgres
